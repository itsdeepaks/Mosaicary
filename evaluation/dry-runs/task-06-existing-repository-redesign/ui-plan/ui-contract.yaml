version: 1
screen:
  id: resource-library-mobile-browsing
  type: existing-repository-redesign
  goal: Let a mobile user search and filter the existing resource library without horizontal overflow or loss of browsing context.
user:
  role: designer-or-developer-browsing-design-resources
  state: mobile-user-exploring-the-catalog
  primary_question: How can I narrow this library to the resources relevant to my current design task?
context_ref: project-ui-context.yaml
hierarchy:
  primary: [search, category-filter, current-result-count, resource-cards]
  secondary: [access-filter, sort-control, source-path, markdown-view]
patterns:
  selected: [task-first-filter-stack, progressive-filter-priority, single-column-resource-list]
  avoided: [horizontal-toolbar-on-mobile, dashboard-conversion, duplicate-filter-controls]
  rationale:
    - Search and category are the fastest high-signal ways to narrow a 295-resource catalog on a narrow screen.
    - Existing controls and cards can be reused by changing layout constraints rather than adding a new product surface.
layout:
  desktop: Preserve the current multi-control toolbar and three-column card grid.
  tablet: Use a two-column toolbar arrangement and two-column card grid when space allows.
  mobile: Stack existing toolbar controls at the container width, keep search first, and render one resource card per row with result count immediately above the list.
components:
  reuse: [toolbar, search-input, category-select, access-select, sort-select, resource-card, library-tab, markdown-tab]
  new: []
  prohibited: [new-component-library, dashboard-widgets, additional-navigation]
states: [library-default, filtered-results, no-results, markdown-tab, csv-load-error]
interaction:
  primary_action: Enter a search or select a category to narrow the resource list.
  keyboard:
    - Keep all existing controls reachable in DOM order.
    - Preserve visible focus treatment for search, selects, tabs, and outbound links.
  feedback:
    - Update the result count after every filter or sort change.
visual:
  density: medium
  motion: restrained
  emphasis: search-and-results
  avoid: [gratuitous-gradients, excessive-card-nesting, decorative-hero-area]
accessibility:
  target: WCAG 2.2 AA
  requirements:
    - Associate persistent labels with search and every select; do not rely only on placeholders.
    - Expose Library and Markdown controls as an accessible tab pattern or clearly labeled view buttons.
    - Do not rely only on color for active state or focus visibility.
verification:
  viewports: [390x844, 768x1024, 1440x1000]
  required_checks:
    - no horizontal overflow at each viewport
    - search, category, access, and sort controls remain operable by keyboard
    - result count changes after filtering
    - no console errors while loading CSV or switching Markdown view
    - CSV load error remains understandable
    - page uses a semantic heading and labeled controls
assumptions:
  - The CSV and Markdown fetch paths remain unchanged.
open_questions:
  - Whether a mobile-only disclosure for access and sort is necessary should be decided after observing the stacked-control prototype.
status: draft
