version: 1
project: design-library-preview
product: Static preview of a 295-resource design-library catalog; future source-catalog seed, not a product dashboard.
users: [designer-or-developer-browsing-design-resources]
jobs:
  - Search resources by name, URL, category, access model, or purpose.
  - Filter the resource library while retaining context about result count and source.
constraints:
  platform: responsive-static-web
  repository_components: [library-tab, markdown-tab, toolbar, search-input, category-select, access-select, sort-select, resource-card, statistics-panel]
  design_tokens: [bg, panel, text, muted, border, accent, soft, shadow]
  accessibility_target: WCAG 2.2 AA
  prohibited_dependencies: [new-framework, component-library, dashboard-redesign]
sources: [index.html, lib_data/design-resource-library-295.csv, lib_data/design-resource-library-295.md, docs/current-state-audit.md]
assumptions:
  - The existing desktop toolbar behavior remains useful and should be preserved unless mobile needs a layout-specific change.
  - Resource cards remain the primary browse result representation.
open_questions:
  - Should mobile retain all three filter controls visibly stacked, or reveal secondary filters after search and category selection?
