version: 1
name: ui-intelligence-track-a-b
purpose: Compare baseline Codex planning/building with the same task using the ui-plan Skill.
conditions:
  baseline:
    ui_plan_skill: unavailable
  ui_plan:
    ui_plan_skill: available
frozen_conditions:
  repository_commit: required
  model: required
  reasoning_level: required
  task_prompt: byte-identical
  run_allowance: required
  available_tools: identical_except_ui_plan_skill
  verification_process: identical
  network_policy: identical
  source_access: identical
capture_requirements:
  - prompt.md
  - transcript.md
  - run-manifest.yaml
  - metrics.yaml
  - validation/
  - screenshots/
  - review.yaml
  - ui-contract.yaml
  - source-request-plan.yaml
evaluation_phases:
  - plan
  - build
  - review
scoring:
  planning_quality: separate_from_rendered_implementation
  human_review: blind_pairwise_comparison
  scale: 1_to_5
stop_condition: Do not run all six scored tasks until the harness and one non-evaluative dry run are reviewed.
