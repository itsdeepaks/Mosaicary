version: 1
project: Tessli V3
product: Human-curated, AI-native design-source router
users:
  - Designers and frontend builders researching a concrete UI task
  - Coding agents selecting and accessing design sources
jobs:
  - Find a small relevant source set
  - Understand fit, access, limitations, and alternatives
  - Retain project decisions and hand compact context to an agent
constraints:
  platform: Next.js public website, deterministic static representations, browser-local Boards, local MCP, and later remote MCP
  repository_components:
    - canonical SourceProfile adapter
    - Browse controls and resource cards
    - Source Detail and Similar Sources
    - Collections
    - Saved and Boards
    - public JSON and Markdown formatters
    - native MCP pure tool layer
  design_tokens:
    - Newsreader Variable display typography
    - Instrument Sans Variable interface typography
    - warm off-white canvas
    - charcoal text
    - restrained orange signal
    - border-led hierarchy
  accessibility_target: WCAG 2.2 AA and verified layouts at 1440, 1024, 768, 390, and 320 pixels
  prohibited_dependencies:
    - theme kits
    - vector database before deterministic retrieval proof
    - screenshot scraping
    - auth or cloud infrastructure
sources:
  - docs/product-direction.md
  - PRD.md
  - build-slices.md
  - AGENTS.md
  - design.md
  - docs/product-scope.md
  - docs/page-contracts.md
  - docs/component-contracts.md
  - docs/research/ui-intelligence-research.md
  - current route and component inventory
  - DesignIndex live-preview reference inspected in browser
facts:
  - Tessli has 295 canonical sources, 40 enriched profiles, six Collections, local Saved and Boards, public JSON and Markdown, and seven local MCP tools.
  - The current homepage duplicates parts of Browse.
  - Current Source Detail and machine packets foreground verification mechanics over useful action guidance.
  - MCP is local stdio only and current retrieval is lexical rather than task-fit oriented.
assumptions:
  - Human pages and machine outputs may use different hierarchy while sharing facts.
  - Live preview is optional human enhancement and never an AI dependency.
open_questions: []
