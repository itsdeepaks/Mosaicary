version: 1
screen:
  id: tessli-v3-product-flow
  type: multi-page human and agent research workflow
  goal: Route a concrete design task to useful sources, access paths, project decisions, and compact agent context.
user:
  role: designer, developer, or coding agent
  state: researching before or during a real UI build
  primary_question: Which source fits this task, why, and how should it be used?
context_ref: project-ui-context.yaml
hierarchy:
  primary:
    - Task intent
    - Small explained source set
    - Source usefulness and preview
    - Best access route
    - Save or project decision
  secondary:
    - Alternatives and Collections
    - Compact references and diagnostics
patterns:
  selected:
    - Task-led search into one canonical Browse
    - Editorial source guide with approved preview
    - Explicit browser, documentation, registry, source-code, API, MCP, CLI, or plugin access route
    - Local project Board with selected and rejected decisions
    - Compact machine representations and read-only MCP
  avoided:
    - Duplicate homepage catalogue
    - Public audit dashboard
    - Raw schema dumps
    - Universal source rankings
    - Iframe-dependent AI access
  rationale:
    - Humans need visual understanding and decisions; agents need compact routing and actions.
    - One canonical source graph prevents website and MCP drift.
    - Provider-native access is more useful and safer than mirroring source content.
layout:
  desktop: Editorial task entry, dense canonical Browse, split source guide, and project workspace with clear primary actions.
  tablet: Preserve source preview and actions while collapsing secondary facts below the decision flow.
  mobile: Recompose into task, preview, actions, usefulness, access, limitations, alternatives, and project context without duplicate result trees.
components:
  reuse:
    - SiteHeader and footer
    - Browse controls
    - ResourceCard and media fallback
    - SourceActions
    - Similar Sources
    - Collections
    - Saved and Boards
  new:
    - AccessRoute presentation
    - TaskFit result explanation
    - SourcePreview on detail pages
    - AddToBoard action
    - Compact agent handoff
  prohibited:
    - new component library
    - mass screenshot capture
    - provider-content proxy
    - fake rankings or metrics
states:
  - Listed source with sparse metadata
  - Enriched source with approved preview and access routes
  - Missing or failed media fallback
  - No alternatives or Collections
  - Empty task search and no-match recovery
  - Local Board validation, export success, and export failure
interaction:
  search: Home and Browse preserve task query in the URL.
  source_actions: Inspect is internal; Visit, Save, and Add to Board remain independent.
  machine_access: Public representations and MCP return compact action guidance with optional diagnostics.
visual:
  direction: Warm editorial Tessli identity with denser research surfaces, restrained orange, and border-led hierarchy.
  previews: Approved static preview first; optional allowlisted live preview later.
accessibility:
  target: WCAG 2.2 AA
  requirements:
    - Semantic landmarks and one h1 per page
    - Keyboard-complete search, filters, menus, Save, and Board actions
    - Visible focus and focus restoration
    - No hover-only meaning
    - 44px touch targets and live announcements
    - No horizontal overflow at 320px
verification:
  viewports:
    - 1440x900
    - 1024x768
    - 768x1024
    - 390x844
    - 320x700
  required_checks:
    - Home does not duplicate Browse.
    - Source guide answers fit, inspection, access, alternatives, and next action.
    - Human pages do not foreground audit mechanics.
    - Task retrieval returns no more than eight explained deterministic results.
    - Website, JSON, Markdown, and MCP share canonical facts.
    - Local Boards remain private unless explicitly exported.
assumptions:
  - Existing approved media and fallback infrastructure remains the preview foundation.
  - Remote MCP begins only after local task retrieval and outputs are stable.
open_questions: []
status: draft
