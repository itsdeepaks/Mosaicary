version: 1
screen:
  id: mosaicary-library
  type: static responsive resource directory
  goal: Let a visitor discover, filter, save, and safely open curated design resources with minimal friction.
user:
  role: designer or developer researching a current build
  state: arriving with a broad or specific resource need
  primary_question: Which resource is relevant, accessible, and worth opening now?
context_ref: project-ui-context.yaml
hierarchy:
  primary:
    - Name and purpose of the library
    - Search and filter controls
    - Filtered resource results and direct open action
  secondary:
    - Result count, active filters, sort order, and local saved list
    - Dataset provenance and Markdown reference
patterns:
  selected:
    - Search-first resource directory
    - Compact filter chips with native select fallback
    - Dense but scannable resource cards
    - Local-only saved resources
  avoided:
    - Dashboard conversion
    - Accounts and remote persistence
    - Infinite scrolling or ornamental hero content
  rationale:
    - The dataset and task are about fast manual discovery, not project management.
    - Native controls, URL state, and local storage retain static-site simplicity.
layout:
  desktop: Restrained editorial header, persistent search/filter area, responsive three-column resource grid, and an optional saved-results state.
  tablet: Two-column cards and two-column controls without intrinsic-width overflow.
  mobile: Search first, controls stack or pair safely, results remain one column, and every primary action remains touch-sized.
components:
  reuse:
    - Existing CSV and Markdown data paths
    - Existing card grid, filter, tab, and CSS-token concepts
  new:
    - Branded wordmark treatment
    - Filter chips and reset action
    - Save toggle backed by localStorage
    - URL query synchronization
  prohibited:
    - Additional UI frameworks or component libraries
    - Remote data ingestion or account flows
states:
  - loading
  - populated
  - filtered-results
  - no-results
  - saved-results
  - csv-load-error
  - markdown-view
interaction:
  search: Filter by resource name, URL, category, access model, and description; synchronize to the URL.
  filters: Filter by category and access model; expose active filters and a clear reset action.
  sort: Preserve name, category, and access options; add a useful featured/recommended ordering only when locally deterministic.
  save: Save and remove resources locally without an account.
  outbound_links: Open resource websites in a new tab with noopener noreferrer.
  tabs: Library, Saved, and Markdown states must remain keyboard reachable and announce selection.
visual:
  direction: Calm editorial index with a warm neutral base, deep ink text, restrained cobalt accent, and orange only for small active-state emphasis.
  density: Medium-high; resource descriptions remain readable and scan quickly.
  avoid:
    - Generic gradient hero sections
    - Heavy glass effects
    - Excessive card nesting
accessibility:
  target: WCAG 2.2 AA-oriented implementation.
  requirements:
    - Associate every input and select with a visible or screen-reader label.
    - Use semantic navigation, headings, buttons, links, and tabpanel relationships.
    - Do not rely on color alone for saved or active state.
    - Preserve visible focus and keyboard navigation.
verification:
  viewports:
    - 390x844
    - 768x1024
    - 1440x1000
  required_checks:
    - No horizontal overflow at any required viewport.
    - Search, filters, reset, sort, saved state, tabs, and outbound link attributes work.
    - URL state restores search/filter/sort choices on reload.
    - CSV failure and no-results states remain useful.
    - Zero axe critical violations and no console or page errors.
assumptions:
  - A static Vercel deployment is an approved manual-library exception, not UI Intelligence hosting.
open_questions: []
status: approved
