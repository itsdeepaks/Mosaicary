version: 1
project: mosaicary
product: A lightweight, public design-resource index for manually finding and opening curated web, UI, component, and design-system resources.
users:
  - Designers and developers looking for a relevant resource during active product work.
jobs:
  - Find a resource by name, capability, category, or access model.
  - Quickly understand what it is for before opening it in a new tab.
  - Keep a small personal shortlist without creating an account.
constraints:
  platform: Static HTML, CSS, and browser JavaScript deployed on Vercel.
  repository_components:
    - index.html toolbar, cards, tabs, statistics, CSV and Markdown loaders
  design_tokens:
    - Existing CSS custom properties for background, panel, text, muted text, border, accent, soft surface, and shadow.
  accessibility_target: Keyboard-operable native controls, persistent labels, visible focus, and no horizontal overflow at required viewports.
  prohibited_dependencies:
    - Frameworks
    - Component libraries
    - Accounts, backend, data scraping, and external product APIs
sources:
  - index.html
  - lib_data/design-resource-library-295.csv
  - lib_data/design-resource-library-295.md
assumptions:
  - The 295-row CSV remains the release source of truth.
  - Browsing history and shortlists can remain local to the browser through localStorage.
  - Outbound resource URLs should always open with noopener protection.
open_questions:
  - A domain and trademark review are outside this release scope.
