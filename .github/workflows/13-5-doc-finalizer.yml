name: Finalize Slice 13.5 documentation

on:
  push:
    branches:
      - feat/native-tessli-mcp
    paths:
      - .github/workflows/13-5-doc-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/native-tessli-mcp
          fetch-depth: 0

      - name: Mark 13.5 complete and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("build-slices.md")
          text = path.read_text(encoding="utf-8")
          old = "| 13.5 | Read-only Tessli MCP over native metadata | PLANNED | 13.4 |"
          new = "| 13.5 | Read-only Tessli MCP over native metadata | DONE | 13.4 |"
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one 13.5 PLANNED ledger row")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git rm .github/workflows/13-5-doc-finalizer.yml

          changed="$(git status --short)"
          printf '%s\n' "$changed"

          git add build-slices.md
          unexpected="$(git diff --cached --name-only | grep -Ev '^build-slices\.md$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged files:"
            echo "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: mark native Tessli MCP slice complete"
          git push origin HEAD:feat/native-tessli-mcp
