name: Source detail contract fixer

on:
  push:
    branches:
      - feat/source-detail-foundation
    paths:
      - ".github/workflows/source-detail-contract-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-detail-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Add source detail visual case
        shell: python
        run: |
          from pathlib import Path

          path = Path("web/tests/release-gate-browser.mjs")
          content = path.read_text(encoding="utf-8")
          marker = '''  {
            name: "saved",'''
          addition = '''  {
            name: "source-detail",
            path: "/resources/designindex",
            selector: "[data-source-detail=designindex]",
          },
          {
            name: "saved",'''
          if 'name: "source-detail"' not in content:
              content = content.replace(marker, addition, 1)
          path.write_text(content, encoding="utf-8")
      - name: Format changed files
        run: npx prettier --write "tests/release-gate-browser.mjs"
        working-directory: web
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/tests/release-gate-browser.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: add source detail responsive matrix"
          git push origin HEAD:feat/source-detail-foundation
