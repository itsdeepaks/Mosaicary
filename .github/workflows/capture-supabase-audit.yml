name: Capture Supabase production audit

on:
  push:
    branches: [feat/local-supabase-clients]
    paths:
      - ".github/workflows/capture-supabase-audit.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-supabase-clients

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Capture production audit
        shell: bash
        run: |
          set +e
          cd web
          npm ci > /tmp/install.log 2>&1
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/docs/slices/10.1a-production-audit.json" 2>&1
          status=$?
          cd ..
          echo "$status" > docs/slices/10.1a-production-audit.status
          rm -f .github/workflows/final-validate-local-supabase-clients.yml
          rm -f .github/workflows/capture-supabase-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: capture Supabase production audit"
          git push origin HEAD:feat/local-supabase-clients
