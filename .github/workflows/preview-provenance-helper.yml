name: Preview provenance helper

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/media-batch-06' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply bounded provenance patch
        run: python .github/scripts/apply-preview-provenance-patch.py

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Format scoped files
        working-directory: web
        run: >-
          npx prettier --write
          ../PRD.md
          ../AGENTS.md
          ../build-slices.md
          ../docs/data-and-media-contract.md
          ../docs/resource-media-workflow.md
          ../docs/slices/5.4b-p-preview-provenance.md
          ../schemas/catalogue.schema.json
          ../schemas/resource-media.schema.json
          ../schemas/resource-media-candidates.schema.json
          scripts/resource-media-discovery-lib.mjs
          scripts/resource-media-review-lib.mjs
          scripts/release-catalogue-lib.mjs
          tests/resource-media-candidates.test.mjs
          tests/resource-media.test.mjs

      - name: Run focused provenance checks
        working-directory: web
        run: |
          node --check scripts/resource-media-discovery-lib.mjs
          node --check scripts/resource-media-review-lib.mjs
          node --check scripts/release-catalogue-lib.mjs
          node --test tests/resource-media-candidates.test.mjs tests/resource-media.test.mjs
          npm run media:review:check
          npm run media:coverage:check
          npm run catalogue:check
          npm run typecheck
          npm run lint

      - name: Commit product changes and remove helpers
        shell: bash
        run: |
          git rm .github/workflows/preview-provenance-helper.yml
          git rm -f .github/workflows/preview-provenance-helper-fixer.yml
          git rm .github/scripts/apply-preview-provenance-patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRD.md AGENTS.md build-slices.md docs schemas web/scripts web/tests
          git commit -m "fix: preserve preview metadata provenance"
          git push origin HEAD:${{ github.head_ref }}
