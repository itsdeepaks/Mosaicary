name: Temporary PR98 Ajv Lock

on:
  push:
    branches:
      - feat/verification-contract-operator-workflow
    paths:
      - .github/pr98-ajv-ready

permissions:
  contents: write

jobs:
  lock-ajv:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/verification-contract-operator-workflow
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and lock Ajv 8
        working-directory: web
        run: npm install --save-dev --save-exact ajv@8.17.1
      - name: Format package files
        working-directory: web
        run: npx prettier --write package.json package-lock.json
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git commit -m "fix: lock Draft 2020 Ajv dependency"
          git push origin HEAD:feat/verification-contract-operator-workflow
