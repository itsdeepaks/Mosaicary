name: Temporary PR98 Ajv Lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lock-ajv:
    if: github.event.pull_request.head.ref == 'feat/verification-contract-operator-workflow'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/verification-contract-operator-workflow
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and lock Ajv 8
        working-directory: web
        run: npm install --save-dev --save-exact ajv@8.17.1
      - name: Format package files
        working-directory: web
        run: npx prettier --write package.json package-lock.json
      - name: Commit lockfile update when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo "Ajv dependency already locked."
          else
            git commit -m "fix: lock Draft 2020 Ajv dependency"
            git push origin HEAD:feat/verification-contract-operator-workflow
          fi
