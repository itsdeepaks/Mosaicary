name: Format enriched detail

on:
  pull_request:
    paths:
      - ".github/workflows/format-enriched-detail.yml"
      - "web/components/source-detail/intelligence-detail.tsx"
      - "web/tests/enriched-source-detail.test.mjs"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prettier --write components/source-detail/intelligence-detail.tsx tests/enriched-source-detail.test.mjs
      - name: Print formatted files
        run: |
          printf '\n--- intelligence-detail.tsx ---\n'
          cat components/source-detail/intelligence-detail.tsx
          printf '\n--- enriched-source-detail.test.mjs ---\n'
          cat tests/enriched-source-detail.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-enriched-detail
          path: |
            web/components/source-detail/intelligence-detail.tsx
            web/tests/enriched-source-detail.test.mjs
          if-no-files-found: error
          retention-days: 1
