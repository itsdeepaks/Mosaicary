name: One-use reviewed media pilot finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'codex/reviewed-media-discovery-pilot' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/reviewed-media-discovery-pilot
          fetch-depth: 0

      - name: Record completed slice
        shell: python
        run: |
          from pathlib import Path

          ledger = Path("build-slices.md")
          text = ledger.read_text(encoding="utf-8")
          anchor = "| 5.3b | Media discovery and review tooling | DONE | 5.3a |"
          row = "| 5.3c | Reviewed media discovery pilot | DONE | 5.3b |"
          if row not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("Expected 5.3b ledger anchor was not found exactly once")
              text = text.replace(anchor, f"{anchor}\n{row}", 1)
          ledger.write_text(text, encoding="utf-8")

          note = Path("docs/slices/5.3c-reviewed-media-discovery-pilot.md")
          note.write_text("""# Slice 5.3c — Reviewed media discovery pilot

Status: **implementation complete; exact-head CI pending**  
Base commit: `cd3d47cf8fc8502e618e86340cc2baa5c1533481`

## Goal

Run the explicit 5.3b discovery workflow for exactly three asset-library resources, inspect every discovered raster manually, and publish only suitable reviewed records through Tessli's approved-media source.

## Reviewed resources

| Resource | Discovery result | Manual decision | Production result |
|---|---|---|---|
| unDraw | Open Graph PNG and PNG favicon | Clean, brand-specific illustration-library preview and recognisable favicon; no advertising or stale campaign content | Preview and favicon approved |
| Storyset | PNG favicon; no qualifying raster preview | Clean Storyset brand mark; preserve favicon-first fallback rather than inventing a preview | Favicon approved |
| DrawKit | Open Graph PNG and PNG favicon | Strong brand-specific preview and usable favicon; no overlays, unrelated promotions, or authentication content | Preview and favicon approved |

Resource IDs:

- unDraw — `resource-73d75733406d`
- Storyset — `resource-92baaed92865`
- DrawKit — `resource-08a9f0e0bd50`

## Evidence

- explicit discovery used checked date `2026-08-01` and only the three listed resource IDs;
- discovery produced 3 candidates and 0 blocked/unresolved outcomes;
- discovery JSON was reviewed from short-lived Actions artifact `tessli-5.3c-media-discovery`;
- the exact two previews and three favicons were reviewed from short-lived Actions artifact `tessli-5.3c-media-review-assets`;
- raster dimensions and file signatures were checked before visual review;
- no third-party image binary or network artifact was committed;
- all temporary network workflows were removed before the final diff.

## Resulting repository state

- approved production media records: **6**;
- candidate review targets: **8**;
- discovered candidates: **3**;
- approved for manual copy: **3**;
- pending discovery: **5**;
- blocked/unresolved: **0**;
- rejected: **0**.

The candidate records retain source URLs, response-header content types, checked dates, provenance, and reviewer notes. The same three reviewed records are copied explicitly into `lib_data/resource-media.json`; candidate data still has no automatic publication path.

## Acceptance criteria result

1. Discovery was limited to unDraw, Storyset, and DrawKit.
2. Network outputs remained short-lived workflow artifacts.
3. Every returned candidate and absence of preview was recorded truthfully.
4. No image binary was committed.
5. No authentication, anti-bot protection, paywall, or private content was bypassed.
6. Candidate and approved sources remained separate.
7. Every exact raster was manually inspected.
8. Exactly three records were approved; the other five queue records remain pending.
9. Approved records use existing resource IDs, HTTPS credential-free raster URLs, verified content types, source pages, source types, and checked dates.
10. Candidate reports and catalogue outputs were regenerated deterministically.
11. Fallback remains manual preview → Open Graph preview → favicon → generated letter mark.
12. Normal build, tests, catalogue generation, and final CI remain network-free.
13. No unrelated UI, auth, Supabase, intelligence-profile, collection, pricing, access-model, or catalogue-content change is included.
14. Focused media/candidate/catalogue tests passed before final CI.
15. The final implementation diff contains no temporary discovery, download, regeneration, or patch workflow.
16. `build-slices.md` records 5.3c as `DONE` for the squash-merge checkpoint.

## Exclusions preserved

- no discovery for the remaining five queued resources;
- no mass enrichment of the 295-resource catalogue;
- no screenshot capture;
- no image proxy, first-party cache, wildcard image optimiser, or remote SVG;
- no automatic approval or publication;
- no invented URL, MIME type, licence, pricing, or access metadata;
- no changes to card layout or fallback implementation;
- no refresh scheduler or broad-coverage follow-on work.

## Verification

Completed before final exact-head CI:

- candidate source validation and deterministic report generation;
- approved-media schema and deterministic catalogue composition;
- candidate isolation from production catalogue composition;
- updated six-record media merge contract;
- catalogue migration and drift checks;
- repository formatting for changed source, generated data, tests, and documentation.

Final typecheck, lint, full test suite, production build, route/browser checks, responsive screenshots, overflow checks, release gate, and Vercel status must pass on the helper-free exact head before squash merge.

## Rollback

Reverting this slice restores the 5.3b queue and prior three approved production records. Discovery tooling and card fallback behaviour remain intact.
""", encoding="utf-8")

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Format and run focused checks
        working-directory: web
        run: |
          npm run format
          npm run media:review:check
          node --test tests/resource-media-candidates.test.mjs tests/resource-media.test.mjs tests/catalogue-migration.test.mjs
          npm run catalogue:check
          npm run format:check

      - name: Commit final slice documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md docs/slices/5.3c-reviewed-media-discovery-pilot.md
          git commit -m "docs: record completed reviewed media pilot"
          git push origin HEAD:codex/reviewed-media-discovery-pilot
