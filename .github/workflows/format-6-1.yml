name: Format Slice 6.1 browser test

on:
  push:
    branches:
      - feat/global-navigation-naming-cleanup
    paths:
      - ".github/workflows/format-6-1.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-navigation-naming-cleanup

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Format exact browser test
        run: npx prettier --write tests/global-navigation-browser.mjs

      - name: Commit formatter output
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/tests/global-navigation-browser.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format global navigation browser test"
            git push origin HEAD:feat/global-navigation-naming-cleanup
          fi
