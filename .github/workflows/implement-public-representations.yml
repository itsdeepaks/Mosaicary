        shell: bash
        run: |
          git config user.name "tessli-agent"
          git config user.email "actions@users.noreply.github.com"
          git add web/lib/public-representations.mjs web/lib/public-representations.d.mts web/app/resources/'[slug]'/'[representation]'/route.ts web/app/collections/'[slug]'/'[representation]'/route.ts web/tests/public-representations.test.mjs web/app/sitemap.ts web/tests/release-gate-browser.mjs
          git commit -m "feat: add public source and collection representations"
          git push origin HEAD:feat/public-machine-readable-representations
