name: Apply media Batch 08
on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  apply:
    if: github.head_ref == 'codex/media-batch-08-reviewed' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref }}", fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - working-directory: web
        run: npm ci
      - name: Download reviewed evidence
        shell: bash
        run: |
          mkdir -p artifacts/media-batch-08
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/8837295663 --jq .digest)" = "sha256:39eb3351af8f2f406a38c269ce5a95468d97c76f4ce641d977df5642c5da898d"
          gh run download 30760504044 --name tessli-media-batch-08-review --dir artifacts/media-batch-08
      - name: Apply decisions
        run: python .github/scripts/apply-reviewed-media-batch.py
      - name: Generate outputs
        working-directory: web
        run: |
          npm run media:review:generate
          npm run media:coverage:generate
          npm run catalogue:generate
      - name: Format authored files
        working-directory: web
        run: npx prettier --write ../docs/remaining-phase-plan.md ../docs/slices/5.4b-08-reviewed-media-discovery.md tests/resource-media.test.mjs tests/resource-media-coverage.test.mjs tests/resource-media-candidates.test.mjs
      - name: Focused checks
        working-directory: web
        run: |
          node --test tests/resource-media.test.mjs tests/resource-media-coverage.test.mjs tests/resource-media-candidates.test.mjs
          npm run media:review:check
          npm run media:coverage:check
          npm run catalogue:check
          npm run typecheck
          npm run lint
      - name: Verify counts and commit
        shell: bash
        run: |
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("lib_data/resource-media.json"));const c=JSON.parse(fs.readFileSync("lib_data/resource-media-coverage.json"));const p=c.resources.filter(x=>x.disposition==="pending").length;if(m.resources.length!==97||p!==127)process.exit(1);console.log({approved:m.resources.length,pending:p})'
          rm -rf artifacts
          git rm .github/workflows/media-batch-08-discovery.yml .github/workflows/apply-media-batch-08.yml .github/scripts/package-media-review.mjs .github/scripts/apply-reviewed-media-batch.py .github/data/media-batch-08-decisions.json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs lib_data web/data web/tests
          git commit -m "feat: approve eighth reviewed media batch"
          git push origin HEAD:${{ github.head_ref }}
