name: Fix canonical Browse CI

on:
  push:
    branches:
      - feat/canonical-browse
    paths:
      - ".github/workflows/fix-canonical-browse-ci.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-browse
      - name: Update retired Browse assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/web-ci.yml')
          text = path.read_text()
          replacements = [
              ('data-result-count="295"', 'data-result-count="12"'),
              ('data-visible-result-count="48"', 'data-visible-result-count="12"'),
              ('data-full-reference-page="true"', 'data-browse-view="cards"'),
              ('data-reference-table="true"', 'data-browse-view="cards"'),
              ('Source-backed, not ranked', 'Browse design sources'),
              ('Checking lab, Explore, resource cards, Collections, and Full Reference', 'Checking lab, homepage preview, resource cards, Collections, and Browse'),
              ('Checking Explore, resource cards, Collections, and Full Reference', 'Checking homepage preview, resource cards, Collections, and Browse'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/web-ci.yml
          git commit -m "test: align Web CI with canonical Browse"
          git push origin HEAD:feat/canonical-browse
