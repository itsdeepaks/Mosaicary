name: Apply OSS review hydration fix

on:
  pull_request:
    paths:
      - ".github/workflows/web-ci.yml"
      - "web/components/oss-human-review/oss-human-review-form.tsx"

permissions:
  contents: write

concurrency:
  group: oss-review-hydration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/oss-homepage-human-review
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Replace hydration effect by structural boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path("web/components/oss-human-review/oss-human-review-form.tsx")
          content = path.read_text(encoding="utf-8")
          start = content.index("  useEffect(() => {\n", content.index("export function OssHumanReviewForm"))
          second = content.index("  useEffect(() => {\n", start + 1)
          replacement = '''  useEffect(() => {
            const frame = window.requestAnimationFrame(() => {
              const today = localIsoDate();
              try {
                const stored = window.localStorage.getItem(
                  OSS_HUMAN_REVIEW_STORAGE_KEY,
                );
                setDraft(
                  stored
                    ? normalizeOssHumanReviewDraft(JSON.parse(stored), today)
                    : createEmptyOssHumanReviewDraft(today),
                );
              } catch {
                setDraft(createEmptyOssHumanReviewDraft(today));
                setAnnouncement(
                  "The saved review draft could not be read. A new local draft was started.",
                );
              }
              setHydrated(true);
            });

            return () => window.cancelAnimationFrame(frame);
          }, []);

          '''
          path.write_text(content[:start] + replacement + content[second:], encoding="utf-8")
      - name: Format and commit
        shell: bash
        run: |
          cd web
          npx prettier --write components/oss-human-review/oss-human-review-form.tsx
          cd ..
          git config user.name "tessli-agent"
          git config user.email "actions@users.noreply.github.com"
          git add web/components/oss-human-review/oss-human-review-form.tsx
          git commit -m "fix: hydrate OSS review draft without cascading render"
          git push origin HEAD:proof/oss-homepage-human-review
