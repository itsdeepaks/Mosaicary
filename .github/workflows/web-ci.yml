name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Reconcile delivery status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("../build-slices.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "| 0.2 | Repository operating contract | NEXT | 0.1 |":
                  "| 0.2 | Repository operating contract | DONE | 0.1 |",
              "| 1.1 | Next.js application scaffold and CI baseline | PLANNED | 0.2 |":
                  "| 1.1 | Next.js application scaffold and CI baseline | DONE | 0.2 |",
              "| 1.2 | Fonts, tokens, grain, responsive layout lab | PLANNED | 1.1 |":
                  "| 1.2 | Fonts, tokens, grain, responsive layout lab | DONE | 1.1 |",
              "| 2.1 | Global header and navigation shell | PLANNED | 1.2 |":
                  "| 2.1 | Global header and navigation shell | DONE | 1.2 |",
              "| 2.2 | Footer and launch route integrity | PLANNED | 2.1 |":
                  "| 2.2 | Footer and launch route integrity | DONE | 2.1 |",
              "| 3.1 | Explore hero composition | PLANNED | 2.2 |":
                  "| 3.1 | Explore hero composition | NEXT | 2.2 |",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
              elif count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(f"Expected exactly one status row: {old!r}; found {count}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format footer workspace
        run: npm run format

      - name: Commit deterministic bootstrap changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../build-slices.md .
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
          else
            git commit -m "chore: reconcile slice status and format footer"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test routes and capture responsive UI
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/tessli-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          curl --fail --silent --show-error \
            --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/ > /tmp/tessli-home.html
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/lab > /tmp/tessli-lab.html

          grep -q "Tessli application foundation" /tmp/tessli-home.html
          grep -q "A warm, editorial system" /tmp/tessli-lab.html
          grep -q 'aria-label="Tessli home"' /tmp/tessli-lab.html
          grep -q 'id="mobile-navigation-sheet"' /tmp/tessli-lab.html

          shell_routes=(
            collections
            resources
            submit
            suggest
            about
            curation
            privacy
            terms
            content-policy
          )

          for route in "${shell_routes[@]}"; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:3000/$route" \
              > "/tmp/tessli-$route.html"
            grep -q "What this route does today" "/tmp/tessli-$route.html"
            grep -q "Return to Explore" "/tmp/tessli-$route.html"
          done

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          mkdir -p artifacts/responsive-ui

          for viewport in "1440:1400" "1024:1400" "768:1400" "390:1400"; do
            IFS=":" read -r width height <<< "$viewport"

            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=1500 \
              --window-size="$width,$height" \
              --dump-dom \
              http://127.0.0.1:3000/lab \
              > "artifacts/responsive-ui/lab-$width.html"
            grep -q 'data-horizontal-overflow="false"' \
              "artifacts/responsive-ui/lab-$width.html"

            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=1500 \
              --window-size="$width,$height" \
              --screenshot="artifacts/responsive-ui/lab-$width.png" \
              http://127.0.0.1:3000/lab
            test -s "artifacts/responsive-ui/lab-$width.png"
          done

          for viewport in "1440:1400" "390:2200"; do
            IFS=":" read -r width height <<< "$viewport"
            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=1500 \
              --window-size="$width,$height" \
              --screenshot="artifacts/responsive-ui/footer-$width.png" \
              http://127.0.0.1:3000/about
            test -s "artifacts/responsive-ui/footer-$width.png"
          done

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tessli-responsive-ui-screenshots
          path: web/artifacts/responsive-ui/*.png
          if-no-files-found: error
          retention-days: 7
