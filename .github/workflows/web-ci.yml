name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/**"
      - "docs/data-and-media-contract.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/**"
      - "docs/data-and-media-contract.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: proof/oss-homepage-human-review

      - name: Align Product Plan v2 and release contract
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/product-plan-v2.md"): {
                  "Status: **active execution plan — Phase 4**":
                      "Status: **active execution plan — Phase 6; Phase 5 proof blocked**",
                  "|     5 | Real OSS Proof Project                      | PROOF    | Evidence that Tessli improves or fails to improve a real workflow          |":
                      "|     5 | Real OSS Proof Project                      | BLOCKED  | Safe review setup complete; genuine human judgment still required          |",
                  "|     6 | Homepage, Navigation, Playbooks, and For AI | PLANNED  | Public presentation built around the proven workflow                       |":
                      "|     6 | Homepage, Navigation, Playbooks, and For AI | ACTIVE   | Independent public-shell work can continue while the proof is blocked      |",
                  "Status: **ACTIVE — PROOF REQUIRED**":
                      "Status: **BLOCKED — GENUINE HUMAN REVIEW REQUIRED**",
                  "### 5.3 Browser and human review\n\nStatus: **NEXT**":
                      "### 5.3 Browser and human review\n\nStatus: **BLOCKED — SAFE REVIEW SETUP COMPLETE**",
                  "### 5.4 Outcome report\n\nReport honestly whether Tessli produced:":
                      "### 5.4 Outcome report\n\nStatus: **BLOCKED — REQUIRES COMPLETED 5.3 HUMAN ARTIFACT**\n\nReport honestly whether Tessli produced:",
                  "### 6.1 Global navigation and naming\n\nPrimary navigation:":
                      "### 6.1 Global navigation and naming\n\nStatus: **NEXT**\n\nPrimary navigation:"
              },
              Path("web/tests/release-hardening.test.mjs"): {
                  '["5.3", "Browser and human review", "NEXT", "5.2", "—"],':
                      '[\n      "5.3",\n      "Browser and human review",\n      "BLOCKED",\n      "5.2",\n      "`docs/slices/5.3-oss-homepage-human-review.md`, PR #91",\n    ],\n    [\n      "5.4",\n      "Outcome/evidence report",\n      "BLOCKED",\n      "5.3 human artifact",\n      "—",\n    ],\n    [\n      "6.1",\n      "Global navigation and naming cleanup",\n      "NEXT",\n      "2.2",\n      "—",\n    ],',
                  '/Status: \\*\\*active delivery plan — Phase 5 \\/ Slice 5\\.3 NEXT\\*\\*/,':
                      '/Status: \\*\\*active delivery plan — Slice 5\\.3 BLOCKED; Phase 6 \\/ Slice 6\\.1 NEXT\\*\\*/,',
                  '/## 9\\. Phase 5 — Real OSS Proof Project\\n\\nStatus: \\*\\*ACTIVE — PROOF REQUIRED\\*\\*/,':
                      '/## 9\\. Phase 5 — Real OSS Proof Project\\n\\nStatus: \\*\\*BLOCKED — GENUINE HUMAN REVIEW REQUIRED\\*\\*/,',
                  '/### 5\\.3 Browser and human review\\n\\nStatus: \\*\\*NEXT\\*\\*/,':
                      '/### 5\\.3 Browser and human review\\n\\nStatus: \\*\\*BLOCKED — SAFE REVIEW SETUP COMPLETE\\*\\*/,',
                  '  assert.match(\n    plan,\n    /### 5\\.3 Browser and human review\\n\\nStatus: \\*\\*BLOCKED — SAFE REVIEW SETUP COMPLETE\\*\\*/,\n  );':
                      '  assert.match(\n    plan,\n    /### 5\\.3 Browser and human review\\n\\nStatus: \\*\\*BLOCKED — SAFE REVIEW SETUP COMPLETE\\*\\*/,\n  );\n  assert.match(\n    plan,\n    /### 5\\.4 Outcome report\\n\\nStatus: \\*\\*BLOCKED — REQUIRES COMPLETED 5\\.3 HUMAN ARTIFACT\\*\\*/,\n  );\n  assert.match(\n    plan,\n    /### 6\\.1 Global navigation and naming\\n\\nStatus: \\*\\*NEXT\\*\\*/,\n  );'
              }
          }

          changed = False
          for path, mapping in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  if old in text:
                      if text.count(old) != 1:
                          raise SystemExit(f"Expected one match in {path}: {old!r}")
                      text = text.replace(old, new)
                      changed = True
                  elif new not in text:
                      raise SystemExit(f"Neither old nor new text found in {path}: {old!r}")
              path.write_text(text, encoding="utf-8", newline="\n")

          if not changed:
              print("Product plan and release contract already aligned.")
          PY

          if ! git diff --quiet -- docs/product-plan-v2.md web/tests/release-hardening.test.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/product-plan-v2.md web/tests/release-hardening.test.mjs
            git commit -m "docs: align blocked proof and next public slice"
            git push origin HEAD:proof/oss-homepage-human-review
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify approved hero asset
        shell: bash
        run: |
          test -s public/brand/tessli-hero-geometry.webp
          echo "0bf8d0fcea17d10b041b2bc08422679acf4fffd7c54fc70c1b18aba9d1d85583  public/brand/tessli-hero-geometry.webp" | sha256sum -c -

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check catalogue drift
        run: npm run catalogue:check

      - name: Build
        run: npm run build

      - name: Measure OSS proof handoff
        run: node scripts/measure-oss-proof-handoff.mjs

      - name: Run canonical route and browser matrix
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/tessli-next.log 2>&1 &
          server_pid=$!
          chrome_pid=""
          cleanup() {
            if [ -n "$chrome_pid" ]; then kill "$chrome_pid" 2>/dev/null || true; fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/resources > /tmp/tessli-resources.html
          grep -q "Browse design sources" /tmp/tessli-resources.html
          grep -q 'data-browse-view="cards"' /tmp/tessli-resources.html
          grep -q "Inspect Tessli profile" /tmp/tessli-resources.html

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/resources/designindex > /tmp/tessli-profile.html
          grep -q "What this profile supports" /tmp/tessli-profile.html

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          mkdir -p artifacts/responsive-ui artifacts/search-browser artifacts/phase-1-release artifacts/oss-proof-candidate artifacts/oss-human-review
          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-allow-origins=* \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/tessli-cdp \
            about:blank > artifacts/search-browser/chrome.log 2>&1 &
          chrome_pid=$!

          node tests/explore-search-browser.mjs 2>&1 | tee artifacts/search-browser/interaction.log
          node tests/discovery-controls-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/explore-results-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/resource-card-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/collections-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/full-reference-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/saved-resources-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/release-gate-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/oss-homepage-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/oss-human-review-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessli-browser-diagnostics
          path: |
            web/artifacts/search-browser/*
            web/artifacts/responsive-ui/*.png
            web/artifacts/phase-1-release/*.png
            web/artifacts/oss-proof-candidate/*.png
            web/artifacts/oss-human-review/*.png
            web/artifacts/oss-proof-metrics.json
          if-no-files-found: warn
          retention-days: 7
