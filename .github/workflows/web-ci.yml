name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "scripts/apply-slice-1.4-contract-fixes.py"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/priority-profile-expansion-batch-2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Apply and format Slice 1.4 contracts
        shell: bash
        run: |
          python scripts/apply-slice-1.4-contract-fixes.py
          cd web
          npx prettier --write \
            data/intelligence-profile-batches/1.4.json \
            tests/source-profile-contract.test.mjs \
            tests/intelligence-profile-batch-1.3.test.mjs \
            tests/intelligence-profile-batch-1.4.test.mjs \
            tests/full-reference-browser.mjs \
            tests/for-ai-browser.mjs
          cd ..
          git config user.name "tessli-agent"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/intelligence-profile-batches/1.4.json web/tests/source-profile-contract.test.mjs web/tests/intelligence-profile-batch-1.3.test.mjs web/tests/intelligence-profile-batch-1.4.test.mjs web/tests/full-reference-browser.mjs web/tests/for-ai-browser.mjs
          git commit -m "fix: align priority profile batch 2 contracts"
          git push origin HEAD:feat/priority-profile-expansion-batch-2
