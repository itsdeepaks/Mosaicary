name: Web CI

on:
  pull_request:
    paths:
      - ".github/workflows/web-ci.yml"
      - "README.md"
      - "web/tests/release-hardening.test.mjs"
      - "scripts/fix-slice-1.4-review.py"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/priority-profile-expansion-batch-2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Apply review fixes
        shell: bash
        run: |
          python -m py_compile scripts/fix-slice-1.4-review.py
          python scripts/fix-slice-1.4-review.py
          cd web
          npx prettier --write ../README.md tests/release-hardening.test.mjs
          cd ..
          git config user.name "tessli-agent"
          git config user.email "actions@users.noreply.github.com"
          git add README.md web/tests/release-hardening.test.mjs
          git commit -m "docs: fix Slice 1.4 review findings"
          git push origin HEAD:feat/priority-profile-expansion-batch-2
