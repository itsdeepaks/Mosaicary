name: Web CI

on:
  pull_request:
    paths:
      - ".github/workflows/web-ci.yml"
      - "docs/slices/**"
      - "web/scripts/apply-slice-6.4-authority.py"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/for-ai-product-page
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Commit final Slice 6.4 authority
        shell: bash
        run: |
          cd ..
          python web/scripts/apply-slice-6.4-authority.py
          cd web
          npx prettier --write ../build-slices.md ../docs/product-plan-v2.md ../docs/page-contracts.md ../docs/slices/6.4-for-ai-product-page.md tests/release-hardening.test.mjs
          cd ..
          git show 78342be0ba2d94027b11d126637a643d3dd7e42e:.github/workflows/web-ci.yml > .github/workflows/web-ci.yml
          git show 78342be0ba2d94027b11d126637a643d3dd7e42e:.github/workflows/phase-1-release-gate.yml > .github/workflows/phase-1-release-gate.yml
          rm -f web/scripts/apply-slice-6.4-authority.py docs/slices/.6.4-authority-trigger docs/slices/.6.4-authority-trigger-2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete Slice 6.4 and lock proof boundary"
          git push origin HEAD:feat/for-ai-product-page
