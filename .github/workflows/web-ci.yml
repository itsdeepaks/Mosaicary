name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/**"
      - "docs/data-and-media-contract.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/**"
      - "docs/data-and-media-contract.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Commit final Slice 1.5 authority contracts
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/verification-contract-operator-workflow'
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          replacements = [
              (
                  '40 Profiled\n→ Slice 1.5: verification contract and operator workflow\n→ first bounded Verified batch',
                  '40 Profiled\n→ Slice 1.5 verification contract/workflow DONE\n→ Slice 1.6 first bounded Verified batch NEXT',
                  'README track',
              ),
              (
                  'The next repository slice is **1.5 Verification Contract and Operator Workflow**. It defines claim-level evidence, freshness, reviewer, credential, persistence, redistribution, and safe-failure rules without promoting a source or claiming that the OSS proof succeeded.',
                  'The next repository slice is **1.6 First Evidence-Backed Verified Batch**. It must select a small bounded set, create current human-operator records through the Slice 1.5 workflow, and promote only records that satisfy every schema and semantic gate.',
                  'README next slice',
              ),
              (
                  'Phase 1  Source Intelligence Foundation          ACTIVE — 1.5 NEXT',
                  'Phase 1  Source Intelligence Foundation          ACTIVE — 1.6 NEXT',
                  'README phase status',
              ),
              (
                  'The approved next repository slice is **Phase 1 / Slice 1.5 — Verification Contract and Operator Workflow**. Slice 5.3 remains the next action in the separate proof track when a genuine reviewer is available.',
                  'The approved next repository slice is **Phase 1 / Slice 1.6 — First Evidence-Backed Verified Batch**. Slice 5.3 remains the next action in the separate proof track when a genuine reviewer is available.',
                  'README approved next',
              ),
          ]
          for old, new, label in replacements:
              readme = replace_required(readme, old, new, label)
          readme_path.write_text(readme)

          test_path = Path('web/tests/release-hardening.test.mjs')
          test_text = test_path.read_text()
          replacements = [
              (
                  '["1.5", "Verification contract and operator workflow", "NEXT", "1.4", "—"],',
                  '[\n      "1.5",\n      "Verification contract and operator workflow",\n      "DONE",\n      "1.4",\n      "`docs/slices/1.5-verification-contract-operator-workflow.md`, PR #98",\n    ],',
                  'test 1.5 row',
              ),
              (
                  '["1.6", "First evidence-backed Verified batch", "PLANNED", "1.5", "—"],',
                  '["1.6", "First evidence-backed Verified batch", "NEXT", "1.5", "—"],',
                  'test 1.6 row',
              ),
              (
                  '/Status: \\*\\*active delivery plan — Phase 1 \\/ Slice 1\\.5 NEXT; proof track remains BLOCKED\\*\\*/,',
                  '/Status: \\*\\*active delivery plan — Phase 1 \\/ Slice 1\\.6 NEXT; proof track remains BLOCKED\\*\\*/,',
                  'test ledger status',
              ),
              (
                  '/Status: \\*\\*active execution plan — Phase 1 \\/ Slice 1\\.5 NEXT; Phase 5 proof remains blocked\\*\\*/,',
                  '/Status: \\*\\*active execution plan — Phase 1 \\/ Slice 1\\.6 NEXT; Phase 5 proof remains blocked\\*\\*/,',
                  'test plan status',
              ),
              (
                  '/### 1\\.5 Verification Contract and Operator Workflow\\n\\nStatus: \\*\\*NEXT\\*\\*/,',
                  '/### 1\\.5 Verification Contract and Operator Workflow\\n\\nStatus: \\*\\*DONE\\*\\*/,',
                  'test 1.5 plan status',
              ),
              (
                  'assert.match(slices, /Product Foundation:.*Phase 1 \\/ Slice 1\\.5 is NEXT/is);',
                  'assert.match(slices, /Product Foundation:.*Phase 1 \\/ Slice 1\\.6 is NEXT/is);',
                  'test continuation boundary',
              ),
              (
                  '/approved next repository slice is \\*\\*Phase 1 \\/ Slice 1\\.5/i,',
                  '/approved next repository slice is \\*\\*Phase 1 \\/ Slice 1\\.6/i,',
                  'test README next',
              ),
          ]
          for old, new, label in replacements:
              test_text = replace_required(test_text, old, new, label)

          plan_assertion = '''  assert.match(
            plan,
            /### 1\\.6 First Evidence-Backed Verified Batch\\n\\nStatus: \\*\\*NEXT\\*\\*/,
          );
'''
          anchor = '''  assert.match(
            plan,
            /### 1\\.5 Verification Contract and Operator Workflow\\n\\nStatus: \\*\\*DONE\\*\\*/,
          );
'''
          if plan_assertion not in test_text:
              if anchor not in test_text:
                  raise SystemExit('test 1.6 plan assertion anchor not found')
              test_text = test_text.replace(anchor, anchor + plan_assertion, 1)
          test_path.write_text(test_text)
          PY
          cd web
          npx prettier --write ../README.md tests/release-hardening.test.mjs
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md web/tests/release-hardening.test.mjs
          if git diff --cached --quiet; then
            echo "Final authority contracts already current."
          else
            git commit -m "test: align release authority with Slice 1.6"
            git push origin HEAD:feat/verification-contract-operator-workflow
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify approved hero asset
        shell: bash
        run: |
          test -s public/brand/tessli-hero-geometry.webp
          echo "0bf8d0fcea17d10b041b2bc08422679acf4fffd7c54fc70c1b18aba9d1d85583  public/brand/tessli-hero-geometry.webp" | sha256sum -c -

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check catalogue drift
        run: npm run catalogue:check

      - name: Build
        run: npm run build

      - name: Measure OSS proof handoff
        run: node scripts/measure-oss-proof-handoff.mjs

      - name: Run canonical route and browser matrix
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/tessli-next.log 2>&1 &
          server_pid=$!
          chrome_pid=""
          cleanup() {
            if [ -n "$chrome_pid" ]; then kill "$chrome_pid" 2>/dev/null || true; fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/resources > /tmp/tessli-resources.html
          grep -q "Browse design sources" /tmp/tessli-resources.html
          grep -q 'data-browse-view="cards"' /tmp/tessli-resources.html
          grep -q "Inspect Tessli profile" /tmp/tessli-resources.html

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/resources/designindex > /tmp/tessli-profile.html
          grep -q "What this profile supports" /tmp/tessli-profile.html

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/for-ai > /tmp/tessli-for-ai.html
          grep -q "Give models structured design research" /tmp/tessli-for-ai.html
          grep -q "search_resources" /tmp/tessli-for-ai.html

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          mkdir -p artifacts/responsive-ui artifacts/search-browser artifacts/phase-1-release artifacts/oss-proof-candidate artifacts/oss-human-review artifacts/global-navigation artifacts/playbooks artifacts/for-ai
          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-allow-origins=* \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/tessli-cdp \
            about:blank > artifacts/search-browser/chrome.log 2>&1 &
          chrome_pid=$!

          node tests/explore-search-browser.mjs 2>&1 | tee artifacts/search-browser/interaction.log
          node tests/discovery-controls-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/explore-results-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/resource-card-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/collections-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/full-reference-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/saved-resources-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/release-gate-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/oss-homepage-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/oss-human-review-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/global-navigation-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/for-ai-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessli-browser-diagnostics
          path: |
            web/artifacts/search-browser/*
            web/artifacts/responsive-ui/*.png
            web/artifacts/phase-1-release/*.png
            web/artifacts/oss-proof-candidate/*.png
            web/artifacts/oss-human-review/*.png
            web/artifacts/global-navigation/*.png
            web/artifacts/playbooks/*.png
            web/artifacts/for-ai/*.png
            web/artifacts/oss-proof-metrics.json
          if-no-files-found: warn
          retention-days: 7
