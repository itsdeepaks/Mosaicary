name: Web CI

on:
  pull_request:
    paths:
      - "web/scripts/catalogue-lib.mjs"
      - "web/tests/catalogue-migration.test.mjs"
      - ".github/scripts/fix-catalogue-validator.mjs"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-schema-validator:
    if: github.head_ref == 'feat/catalogue-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out catalogue branch
        uses: actions/checkout@v4
        with:
          ref: feat/catalogue-migration

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Align custom validator with JSON Schema properties
        run: node ../.github/scripts/fix-catalogue-validator.mjs

      - name: Format reviewed files
        run: npx prettier --write scripts/catalogue-lib.mjs tests/catalogue-migration.test.mjs

      - name: Run catalogue tests and drift check
        run: |
          npm test
          npm run catalogue:check

      - name: Commit reviewed validator fix only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalogue-lib.mjs tests/catalogue-migration.test.mjs
          if git diff --cached --quiet; then
            echo "Validator fix is already current."
          else
            git commit -m "fix: align catalogue validator with schema"
            git push origin HEAD:feat/catalogue-migration
          fi
