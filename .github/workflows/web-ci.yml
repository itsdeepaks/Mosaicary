name: Web CI

on:
  pull_request:
    paths:
      - "web/scripts/catalogue-lib.mjs"
      - "web/tests/catalogue-migration.test.mjs"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-schema-validator:
    if: github.head_ref == 'feat/catalogue-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out catalogue branch
        uses: actions/checkout@v4
        with:
          ref: feat/catalogue-migration

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Align custom validator with JSON Schema properties
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              return dedent(value).strip()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              old = block(old)
              new = block(new)
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} block; found {count}")
              return text.replace(old, new)

          library = Path("scripts/catalogue-lib.mjs")
          text = library.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''
              function exactKeys(value, allowedKeys) {
                const keys = Object.keys(value).sort();
                const expected = [...allowedKeys].sort();
                return (
                  keys.length === expected.length &&
                  keys.every((key, index) => key === expected[index])
                );
              }
              ''',
              '''
              function objectShapeErrors(value, requiredKeys, allowedKeys, label) {
                const missingKeys = requiredKeys.filter(
                  (key) => !Object.hasOwn(value, key),
                );
                const unexpectedKeys = Object.keys(value).filter(
                  (key) => !allowedKeys.includes(key),
                );
                const errors = [];

                if (missingKeys.length > 0) {
                  errors.push(
                    `${label} is missing required keys: ${missingKeys.join(", ")}.`,
                  );
                }
                if (unexpectedKeys.length > 0) {
                  errors.push(
                    `${label} has unexpected keys: ${unexpectedKeys.join(", ")}.`,
                  );
                }

                return errors;
              }
              ''',
              "exactKeys helper",
          )
          text = replace_once(
              text,
              '''
                if (!exactKeys(catalogue, schema.required)) {
                  errors.push(
                    "Catalogue top-level keys do not match the deterministic schema contract.",
                  );
                }
              ''',
              '''
                errors.push(
                  ...objectShapeErrors(
                    catalogue,
                    schema.required,
                    Object.keys(schema.properties),
                    "Catalogue",
                  ),
                );
              ''',
              "catalogue shape",
          )
          text = replace_once(
              text,
              '''
                  if (!exactKeys(category, categorySchema.required)) {
                    errors.push(
                      `Category ${category.id ?? "<unknown>"} has unexpected keys.`,
                    );
                  }
              ''',
              '''
                  errors.push(
                    ...objectShapeErrors(
                      category,
                      categorySchema.required,
                      Object.keys(categorySchema.properties),
                      `Category ${category.id ?? "<unknown>"}`,
                    ),
                  );
              ''',
              "category shape",
          )
          text = replace_once(
              text,
              '''
                  if (!exactKeys(resource, resourceSchema.required)) {
                    errors.push(
                      `Resource ${resource.id ?? "<unknown>"} has unexpected keys.`,
                    );
                  }
              ''',
              '''
                  errors.push(
                    ...objectShapeErrors(
                      resource,
                      resourceSchema.required,
                      Object.keys(resourceSchema.properties),
                      `Resource ${resource.id ?? "<unknown>"}`,
                    ),
                  );
              ''',
              "resource shape",
          )
          library.write_text(text, encoding="utf-8")

          tests = Path("tests/catalogue-migration.test.mjs")
          test_text = tests.read_text(encoding="utf-8")
          import_old = "  REPORT_PATH,\n  slugify,\n"
          import_new = (
              "  REPORT_PATH,\n"
              "  SCHEMA_PATH,\n"
              "  slugify,\n"
              "  validateCatalogueAgainstSchema,\n"
          )
          if import_new not in test_text:
              if test_text.count(import_old) != 1:
                  raise SystemExit("Could not locate catalogue test import block.")
              test_text = test_text.replace(import_old, import_new)

          marker = 'test("committed catalogue data matches deterministic migration output", async () => {'
          regression = block('''
          test("schema shape accepts defined optional properties and rejects unknown keys", async () => {
            const { catalogue } = await catalogueBuild();
            const schema = JSON.parse(
              await readFile(path.join(repoRoot, SCHEMA_PATH), "utf8"),
            );
            const withOptionalFields = structuredClone(catalogue);
            withOptionalFields.generatedAt = "2026-07-28T00:00:00.000Z";
            withOptionalFields.resources[0].faviconUrl =
              "https://designindex.xyz/favicon.ico";
            withOptionalFields.resources[0].previewImageUrl =
              "https://designindex.xyz/preview.webp";
            withOptionalFields.resources[0].previewSource = "manual";
            withOptionalFields.resources[0].lastVerifiedAt = "2026-07-28";

            assert.deepEqual(
              validateCatalogueAgainstSchema(withOptionalFields, schema),
              [],
            );

            withOptionalFields.resources[0].unsupportedField = true;
            assert.equal(
              validateCatalogueAgainstSchema(withOptionalFields, schema).some(
                (message) => message.includes("unexpected keys: unsupportedField"),
              ),
              true,
            );
          });
          ''') + "\n\n"
          if regression not in test_text:
              if test_text.count(marker) != 1:
                  raise SystemExit("Could not locate committed-output test marker.")
              test_text = test_text.replace(marker, regression + marker)
          tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Format reviewed files
        run: npx prettier --write scripts/catalogue-lib.mjs tests/catalogue-migration.test.mjs

      - name: Run catalogue tests and drift check
        run: |
          npm test
          npm run catalogue:check

      - name: Commit reviewed validator fix only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalogue-lib.mjs tests/catalogue-migration.test.mjs
          if git diff --cached --quiet; then
            echo "Validator fix is already current."
          else
            git commit -m "fix: align catalogue validator with schema"
            git push origin HEAD:feat/catalogue-migration
          fi
