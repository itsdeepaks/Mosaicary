name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "docs/slices/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/for-ai-product-page

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Commit exact For AI formatting
        shell: bash
        run: |
          npx prettier --write app/for-ai/page.tsx lib/mcp-tool-catalogue.ts mcp/server.ts tests/for-ai-browser.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/for-ai/page.tsx lib/mcp-tool-catalogue.ts mcp/server.ts tests/for-ai-browser.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format For AI implementation"
            git push origin HEAD:feat/for-ai-product-page
          fi
