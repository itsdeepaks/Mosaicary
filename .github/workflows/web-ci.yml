name: Web CI Slice 4.2 Formatter

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: write

concurrency:
  group: slice-4-2-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/deterministic-markdown-export

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Format Slice 4.2 files
        run: |
          npx prettier --write \
            components/project-boards/board-export-controls.tsx \
            components/project-boards/project-boards-experience.tsx \
            lib/board-research-pack.mjs \
            tests/board-research-pack.test.mjs

      - name: Commit formatting
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            web/components/project-boards/board-export-controls.tsx \
            web/components/project-boards/project-boards-experience.tsx \
            web/lib/board-research-pack.mjs \
            web/tests/board-research-pack.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format deterministic Board export"
            git push origin HEAD:feat/deterministic-markdown-export
          fi
