name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - "schemas/catalogue.schema.json"
      - "docs/data-and-media-contract.md"
      - "README.md"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-catalogue:
    if: github.head_ref == 'feat/catalogue-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out catalogue branch
        uses: actions/checkout@v4
        with:
          ref: feat/catalogue-migration

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Reconcile the researched after-trial source value
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("scripts/catalogue-lib.mjs"): [
                  (
                      '  ["Yes", "yes"],\n]);',
                      '  ["Yes", "yes"],\n  ["After trial", "after-trial"],\n]);',
                  ),
                  (
                      '  const subscriptionCounts = { no: 0, optional: 0, yes: 0 };',
                      '  const subscriptionCounts = {\n    no: 0,\n    optional: 0,\n    yes: 0,\n    "after-trial": 0,\n  };',
                  ),
              ],
              Path("../schemas/catalogue.schema.json"): [
                  (
                      '"enum": ["no", "optional", "yes"]',
                      '"enum": ["no", "optional", "yes", "after-trial"]',
                  ),
              ],
              Path("../docs/data-and-media-contract.md"): [
                  (
                      "subscriptionRequired: 'no' | 'optional' | 'yes'",
                      "subscriptionRequired: 'no' | 'optional' | 'yes' | 'after-trial'",
                  ),
              ],
              Path("tests/catalogue-migration.test.mjs"): [
                  (
                      '  assert.equal(report.summary.access["free-trial"], 1);',
                      '  assert.equal(report.summary.access["free-trial"], 1);\n  assert.equal(report.summary.subscriptionRequired["after-trial"], 1);',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if new in text:
                      continue
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"Expected one source-contract occurrence in {path}: {old!r}; found {count}"
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Generate deterministic catalogue
        run: npm run catalogue:generate

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessli-catalogue-validation-diagnostic
          path: web/data/catalogue-validation.json
          if-no-files-found: warn
          retention-days: 2

      - name: Apply repository formatter to migration files
        run: >-
          npx prettier --write
          scripts/catalogue-lib.mjs
          scripts/generate-catalogue.mjs
          scripts/check-catalogue.mjs
          tests/catalogue-migration.test.mjs
          package.json
          ../schemas/catalogue.schema.json
          ../docs/data-and-media-contract.md
          ../README.md

      - name: Run focused catalogue tests
        run: npm test

      - name: Verify deterministic output
        run: npm run catalogue:check

      - name: Commit only approved migration output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/catalogue.json \
            data/catalogue-validation.json \
            scripts/catalogue-lib.mjs \
            scripts/generate-catalogue.mjs \
            scripts/check-catalogue.mjs \
            tests/catalogue-migration.test.mjs \
            package.json \
            ../schemas/catalogue.schema.json \
            ../docs/data-and-media-contract.md \
            ../README.md
          if git diff --cached --quiet; then
            echo "Catalogue and migration files are already current."
          else
            git commit -m "data: generate validated Tessli catalogue"
            git push origin HEAD:feat/catalogue-migration
          fi
