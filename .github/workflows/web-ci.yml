name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "docs/slices/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-to-playbooks

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Commit Playbook release smoke contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/release-gate-browser.mjs")
          source = path.read_text()
          replacements = {
              '["/collections", 200, "Six reviewed collections"]': '["/collections", 200, "Six staged Playbooks"]',
              "'\"contract\": \"tessli.public-collection.v1\"'": "'\"contract\": \"tessli.public-playbook.v2\"'",
              '"# Tessli Collection — SaaS landing-page references"': '"# Tessli Playbook — SaaS landing-page references"',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, found {source.count(old)}")
              source = source.replace(old, new)
          path.write_text(source)
          PY
          npx prettier --write tests/release-gate-browser.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release-gate-browser.mjs
          git commit -m "test: align release gate with Playbooks"
          git push origin HEAD:feat/collections-to-playbooks
