name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "docs/slices/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-to-playbooks

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Commit exact Playbook page test formatting
        shell: bash
        run: |
          npx prettier --write tests/collections-pages.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/collections-pages.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format Playbook page contract"
            git push origin HEAD:feat/collections-to-playbooks
          fi
