name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/catalogue.schema.json"
      - "schemas/collections.schema.json"
      - "docs/data-and-media-contract.md"
      - "docs/slices/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/catalogue.schema.json"
      - "schemas/collections.schema.json"
      - "docs/data-and-media-contract.md"
      - "docs/slices/**"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-collection-output:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/collection-schema-data'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate validated catalogue outputs
        run: npm run catalogue:generate

      - name: Commit deterministic outputs
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- web/data/catalogue.json web/data/catalogue-validation.json; then
            echo "Generated catalogue outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/catalogue.json web/data/catalogue-validation.json
          git commit -m "data: generate launch collections"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify approved hero asset
        shell: bash
        run: |
          test -s public/brand/tessli-hero-geometry.webp
          echo "0bf8d0fcea17d10b041b2bc08422679acf4fffd7c54fc70c1b18aba9d1d85583  public/brand/tessli-hero-geometry.webp" | sha256sum -c -

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check catalogue drift
        run: npm run catalogue:check

      - name: Build
        run: npm run build

      - name: Smoke test routes and capture responsive UI
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/tessli-next.log 2>&1 &
          server_pid=$!
          search_chrome_pid=""

          cleanup() {
            if [ -n "$search_chrome_pid" ]; then
              kill "$search_chrome_pid" 2>/dev/null || true
            fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          curl --fail --silent --show-error \
            --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/ > /tmp/tessli-home.html
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/lab > /tmp/tessli-lab.html
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/lab/resource-cards > /tmp/tessli-resource-cards.html

          grep -q "Find better design resources, faster" /tmp/tessli-home.html
          grep -q "Search Tessli resources" /tmp/tessli-home.html
          grep -q "Browser-local saves" /tmp/tessli-home.html
          grep -q "Browse resources by category" /tmp/tessli-home.html
          grep -q "All resources" /tmp/tessli-home.html
          grep -q 'data-explore-results="ready"' /tmp/tessli-home.html
          grep -q 'data-result-count="295"' /tmp/tessli-home.html
          grep -q 'data-visible-result-count="48"' /tmp/tessli-home.html
          grep -q 'data-resource-grid="true"' /tmp/tessli-home.html
          grep -q "tessli-hero-geometry.webp" /tmp/tessli-home.html
          grep -q "A warm, editorial system" /tmp/tessli-lab.html
          grep -q 'aria-label="Tessli home"' /tmp/tessli-lab.html
          grep -q 'id="mobile-navigation-sheet"' /tmp/tessli-lab.html
          grep -q "Twelve resilience cases" /tmp/tessli-resource-cards.html
          grep -q "Fixture boundary" /tmp/tessli-resource-cards.html
          grep -q "data-resource-card-pilot" /tmp/tessli-resource-cards.html

          shell_routes=(collections resources saved submit suggest about curation privacy terms content-policy)
          for route in "${shell_routes[@]}"; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:3000/$route" > "/tmp/tessli-$route.html"
            grep -q "What this route does today" "/tmp/tessli-$route.html"
            grep -q "Return to Explore" "/tmp/tessli-$route.html"
          done

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          mkdir -p artifacts/responsive-ui artifacts/search-browser

          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-allow-origins=* \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/tessli-search-cdp \
            about:blank > artifacts/search-browser/chrome.log 2>&1 &
          search_chrome_pid=$!
          node tests/explore-search-browser.mjs 2>&1 | tee artifacts/search-browser/interaction.log
          node tests/discovery-controls-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/explore-results-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/resource-card-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          kill "$search_chrome_pid" 2>/dev/null || true
          wait "$search_chrome_pid" 2>/dev/null || true
          search_chrome_pid=""

          for viewport in "1440:1800" "1024:1800" "768:1800" "390:1800"; do
            IFS=":" read -r width height <<< "$viewport"
            echo "Checking lab, Explore, and resource cards at ${width}px"

            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=1800 \
              --window-size="$width,$height" \
              --dump-dom \
              http://127.0.0.1:3000/lab \
              > "artifacts/responsive-ui/lab-$width.html"
            grep -q 'data-horizontal-overflow="false"' \
              "artifacts/responsive-ui/lab-$width.html"

            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=2200 \
              --window-size="$width,$height" \
              --dump-dom \
              http://127.0.0.1:3000/ \
              > "artifacts/responsive-ui/explore-$width.html"
            grep -q 'data-horizontal-overflow="false"' \
              "artifacts/responsive-ui/explore-$width.html"
            grep -q "Find better design resources, faster" \
              "artifacts/responsive-ui/explore-$width.html"
            grep -q 'data-search-state="empty"' \
              "artifacts/responsive-ui/explore-$width.html"
            grep -q 'data-discovery-category="all"' \
              "artifacts/responsive-ui/explore-$width.html"
            grep -q 'data-explore-results="ready"' \
              "artifacts/responsive-ui/explore-$width.html"
            grep -q 'data-result-count="295"' \
              "artifacts/responsive-ui/explore-$width.html"
            grep -q 'data-visible-result-count="48"' \
              "artifacts/responsive-ui/explore-$width.html"
            grep -q 'data-resource-grid="true"' \
              "artifacts/responsive-ui/explore-$width.html"

            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=2200 \
              --window-size="$width,$height" \
              --screenshot="artifacts/responsive-ui/explore-$width.png" \
              http://127.0.0.1:3000/
            test -s "artifacts/responsive-ui/explore-$width.png"

            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=2200 \
              --window-size="$width,$height" \
              --dump-dom \
              http://127.0.0.1:3000/lab/resource-cards \
              > "artifacts/responsive-ui/resource-cards-$width.html"
            grep -q 'data-horizontal-overflow="false"' \
              "artifacts/responsive-ui/resource-cards-$width.html"
            grep -q 'data-resource-card-pilot' \
              "artifacts/responsive-ui/resource-cards-$width.html"
            grep -q 'data-media-state="generated"' \
              "artifacts/responsive-ui/resource-cards-$width.html"

            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=2200 \
              --window-size="$width,$height" \
              --screenshot="artifacts/responsive-ui/resource-cards-$width.png" \
              http://127.0.0.1:3000/lab/resource-cards
            test -s "artifacts/responsive-ui/resource-cards-$width.png"
          done

          width=320
          height=1800
          echo "Checking Explore and resource cards at ${width}px"
          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --virtual-time-budget=2200 \
            --window-size="$width,$height" \
            --dump-dom \
            http://127.0.0.1:3000/ \
            > "artifacts/responsive-ui/explore-$width.html"
          grep -q 'data-horizontal-overflow="false"' \
            "artifacts/responsive-ui/explore-$width.html"
          grep -q "Find better design resources, faster" \
            "artifacts/responsive-ui/explore-$width.html"
          grep -q 'data-discovery-category="all"' \
            "artifacts/responsive-ui/explore-$width.html"
          grep -q 'data-explore-results="ready"' \
            "artifacts/responsive-ui/explore-$width.html"
          grep -q 'data-result-count="295"' \
            "artifacts/responsive-ui/explore-$width.html"
          grep -q 'data-resource-grid="true"' \
            "artifacts/responsive-ui/explore-$width.html"

          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --virtual-time-budget=2200 \
            --window-size="$width,$height" \
            --screenshot="artifacts/responsive-ui/explore-$width.png" \
            http://127.0.0.1:3000/
          test -s "artifacts/responsive-ui/explore-$width.png"

          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --virtual-time-budget=2200 \
            --window-size="$width,$height" \
            --dump-dom \
            http://127.0.0.1:3000/lab/resource-cards \
            > "artifacts/responsive-ui/resource-cards-$width.html"
          grep -q 'data-horizontal-overflow="false"' \
            "artifacts/responsive-ui/resource-cards-$width.html"
          grep -q 'data-resource-card-pilot' \
            "artifacts/responsive-ui/resource-cards-$width.html"

          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --virtual-time-budget=2200 \
            --window-size="$width,$height" \
            --screenshot="artifacts/responsive-ui/resource-cards-$width.png" \
            http://127.0.0.1:3000/lab/resource-cards
          test -s "artifacts/responsive-ui/resource-cards-$width.png"

      - name: Upload search browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessli-search-browser-diagnostics
          path: web/artifacts/search-browser/*
          if-no-files-found: warn
          retention-days: 2

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessli-responsive-ui-screenshots
          path: web/artifacts/responsive-ui/*.png
          if-no-files-found: warn
          retention-days: 7
