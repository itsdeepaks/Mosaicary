name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/**"
      - "docs/data-and-media-contract.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/**"
      - "docs/data-and-media-contract.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/collections-to-playbooks

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Apply canonical Playbooks patch once
        working-directory: .
        shell: bash
        run: |
          cat .github/scripts/playbooks-patch.part00 .github/scripts/playbooks-patch.part01 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/tessli-playbooks.patch
          patch --batch --forward -p2 < /tmp/tessli-playbooks.patch

          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("web/tests/site-header.test.mjs"): [
                  ('label: "Collections"', 'label: "Playbooks"'),
              ],
              Path("web/tests/footer-route-integrity.test.mjs"): [
                  ('label: "Collections"', 'label: "Playbooks"'),
              ],
              Path("web/tests/global-navigation-browser.mjs"): [
                  ('["Collections", "/collections"]', '["Playbooks", "/collections"]'),
                  ('["Browse", "Collections"]', '["Browse", "Playbooks"]'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"Expected exactly one match in {path}: {old!r}; found {count}"
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          route = Path("web/app/collections/[slug]/[representation]/route.ts")
          route_text = route.read_text(encoding="utf-8")
          route.write_text(
              route_text.replace("Collection not found", "Playbook not found"),
              encoding="utf-8",
              newline="\n",
          )
          PY

          cd web
          npm run catalogue:generate
          npx prettier --write \
            ../lib_data/tessli-launch-collections.json \
            ../schemas/collections.schema.json \
            app/collections/page.tsx \
            'app/collections/[slug]/page.tsx' \
            'app/collections/[slug]/collection-detail.module.css' \
            'app/collections/[slug]/[representation]/route.ts' \
            components/collection-card/collection-card.tsx \
            components/collection-resources/collection-resource-list.tsx \
            components/collection-resources/collection-resource-list.module.css \
            components/site-header/navigation.ts \
            components/site-footer/footer-navigation.ts \
            data/catalogue.json \
            lib/collections.ts \
            lib/public-representations.mjs \
            scripts/release-catalogue-lib.mjs \
            tests/collections-browser.mjs \
            tests/collections-data.test.mjs \
            tests/collections-pages.test.mjs \
            tests/footer-route-integrity.test.mjs \
            tests/global-navigation-browser.mjs \
            tests/public-representations.test.mjs \
            tests/site-header.test.mjs
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib_data/tessli-launch-collections.json \
            schemas/collections.schema.json \
            web/app/collections \
            web/components/collection-card \
            web/components/collection-resources \
            web/components/site-header/navigation.ts \
            web/components/site-footer/footer-navigation.ts \
            web/data/catalogue.json \
            web/lib/collections.ts \
            web/lib/public-representations.mjs \
            web/scripts/release-catalogue-lib.mjs \
            web/tests/collections-browser.mjs \
            web/tests/collections-data.test.mjs \
            web/tests/collections-pages.test.mjs \
            web/tests/footer-route-integrity.test.mjs \
            web/tests/global-navigation-browser.mjs \
            web/tests/public-representations.test.mjs \
            web/tests/site-header.test.mjs
          git commit -m "feat: add staged Playbook guidance"
          git push origin HEAD:feat/collections-to-playbooks

      - name: Verify approved hero asset
        shell: bash
        run: |
          test -s public/brand/tessli-hero-geometry.webp
          echo "0bf8d0fcea17d10b041b2bc08422679acf4fffd7c54fc70c1b18aba9d1d85583  public/brand/tessli-hero-geometry.webp" | sha256sum -c -

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check catalogue drift
        run: npm run catalogue:check

      - name: Build
        run: npm run build
