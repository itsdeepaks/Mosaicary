name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "lib_data/tessli-launch-collections.json"
      - "docs/slices/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-to-playbooks

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Commit generated Playbook contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/catalogue-lib.mjs")
          source = path.read_text()
          pattern = re.compile(
              r"  const categories = CATEGORY_DEFINITIONS\.map\(\n"
              r"    \(\{ sourceLabel, expectedCount, \.\.\.category \}\) => \(\{\n"
              r"      id: category\.id,\n"
              r"      label: sourceLabel,\n"
              r"      shortLabel: category\.shortLabel,\n"
              r"      description: category\.description,\n"
              r"      icon: category\.icon,\n"
              r"      order: category\.order,\n"
              r"    \}\),\n"
              r"  \);"
          )
          replacement = """  const categories = CATEGORY_DEFINITIONS.map((category) => ({
            id: category.id,
            label: category.sourceLabel,
            shortLabel: category.shortLabel,
            description: category.description,
            icon: category.icon,
            order: category.order,
          }));"""
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one category projection block, found {count}")
          path.write_text(updated)
          PY
          npm run catalogue:generate
          npx prettier --write scripts/catalogue-lib.mjs tests/public-representations.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json data/catalogue-validation.json scripts/catalogue-lib.mjs tests/public-representations.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Playbook generated contract"
            git push origin HEAD:feat/collections-to-playbooks
          fi
