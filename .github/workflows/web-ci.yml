name: Fix OSS review browser storage ordering

on:
  pull_request:
    paths:
      - ".github/workflows/web-ci.yml"
      - "web/tests/oss-human-review-browser.mjs"

permissions:
  contents: write

concurrency:
  group: oss-review-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/oss-homepage-human-review
      - name: Patch storage ordering
        shell: python
        run: |
          from pathlib import Path

          path = Path("web/tests/oss-human-review-browser.mjs")
          content = path.read_text(encoding="utf-8")
          old = '''const storageId = { securityOrigin: origin, isLocalStorage: true };
          await send("DOMStorage.setDOMStorageItem", {
            storageId,
            key: storageKey,
            value: "{malformed-json",
          });
          '''
          new = '''const storageId = { securityOrigin: origin, isLocalStorage: true };
          await navigate(`${origin}/`);
          await send("DOMStorage.setDOMStorageItem", {
            storageId,
            key: storageKey,
            value: "{malformed-json",
          });
          '''
          if old not in content:
              raise SystemExit("storage ordering target mismatch")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx prettier --write tests/oss-human-review-browser.mjs
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "tessli-agent"
          git config user.email "actions@users.noreply.github.com"
          git add web/tests/oss-human-review-browser.mjs
          git commit -m "fix: seed OSS review storage after origin navigation"
          git push origin HEAD:proof/oss-homepage-human-review
