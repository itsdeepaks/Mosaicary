name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "docs/proofs/oss-homepage/**"
      - "docs/slices/5.3-oss-homepage-human-review.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Isolate human-review contract
        run: node --test --test-reporter=spec tests/oss-human-review-contract.test.mjs
