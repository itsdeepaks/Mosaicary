name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "build-slices.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-to-playbooks

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Commit Slice 6.3 authority
        shell: bash
        run: |
          cd ..
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_string, old, new):
              path = Path(path_string)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              path.write_text(source.replace(old, new, 1))

          replace_once(
              "build-slices.md",
              "Status: **active delivery plan — Slice 5.3 BLOCKED; Phase 6 / Slice 6.3 NEXT**",
              "Status: **active delivery plan — Slice 5.3 BLOCKED; Phase 6 / Slice 6.4 NEXT**",
          )
          replace_once(
              "build-slices.md",
              "- six repository-maintained collections;",
              "- six repository-maintained staged Playbooks;",
          )
          replace_once(
              "build-slices.md",
              "|     6 | Homepage, Navigation, Playbooks, and For AI | ACTIVE   | 6.3 NEXT                   |",
              "|     6 | Homepage, Navigation, Playbooks, and For AI | ACTIVE   | 6.4 NEXT                   |",
          )
          replace_once(
              "build-slices.md",
              "| 6.3  | Collections-to-playbooks conversion                   | NEXT     | 3.3, 4.2                | —                                                                    |\n| 6.4  | For AI product page                                   | PLANNED  | 2.4, 4.3                | —                                                                    |",
              "| 6.3  | Collections-to-playbooks conversion                   | DONE     | 3.3, 4.2                | `docs/slices/6.3-collections-to-playbooks.md`, PR #93                 |\n| 6.4  | For AI product page                                   | NEXT     | 2.4, 4.3                | —                                                                    |",
          )

          replace_once(
              "docs/product-plan-v2.md",
              "### 6.3 Collections become playbooks\n\nStatus: **NEXT**",
              "### 6.3 Collections become playbooks\n\nStatus: **DONE**",
          )
          replace_once(
              "docs/product-plan-v2.md",
              "- last reviewed date.\n\n### 6.4 For AI\n\nStatus: **PLANNED**",
              "- last reviewed date.\n\nEvidence: `docs/slices/6.3-collections-to-playbooks.md`, PR #93.\n\n### 6.4 For AI\n\nStatus: **NEXT**",
          )

          replace_once(
              "docs/slices/6.3-collections-to-playbooks.md",
              "Status: **IN PROGRESS**",
              "Status: **DONE**",
          )
          replace_once(
              "docs/slices/6.3-collections-to-playbooks.md",
              "## Rollback\n\nRestore version-1 collection schema/data, prior collection rendering and terminology, and the version-1 public collection representation.",
              "## Delivered\n\n- all six existing Collections now validate as version-2 staged Playbooks;\n- the existing 60-source membership and editorial order are preserved exactly across 18 stages;\n- outcome, audience, inspection objective, supported decision, and source role come from canonical repository data;\n- website pages and public JSON/Markdown share the same Playbook truth;\n- `/collections` URLs, IDs, slugs, Saved data, Boards, and provider links remain compatible;\n- Playbook index/detail routes expose responsive, accessible Save, Board, Markdown, and JSON paths;\n- navigation and footer terminology use Playbooks without introducing a redirect or a seventh Playbook.\n\n## Validation evidence\n\n- formatting, typecheck, lint, 197 unit/contract tests, catalogue drift, and production build passed;\n- Web CI and Phase 1 Release Gate passed on the read-only implementation head before the final authority update;\n- Playbook browser checks passed for index, stage guidance, public exports, Save behavior, source visits, and responsive layouts;\n- reviewed screenshots cover the 1440×900 index/detail and 390×844 detail compositions with no horizontal overflow or duplicated result tree;\n- no homepage, auth, cloud, provider, Pattern Candidate, ranking, verification, or UI-taste scope was added.\n\nEvidence PR: #93.\n\n## Rollback\n\nRestore version-1 collection schema/data, prior collection rendering and terminology, and the version-1 public collection representation.",
          )

          replace_once(
              "web/tests/release-hardening.test.mjs",
              '["6.3", "Collections-to-playbooks conversion", "NEXT", "3.3, 4.2", "—"],',
              '[\n      "6.3",\n      "Collections-to-playbooks conversion",\n      "DONE",\n      "3.3, 4.2",\n      "`docs/slices/6.3-collections-to-playbooks.md`, PR #93",\n    ],\n    ["6.4", "For AI product page", "NEXT", "2.4, 4.3", "—"],',
          )
          replace_once(
              "web/tests/release-hardening.test.mjs",
              "/Status: \\*\\*active delivery plan — Slice 5\\.3 BLOCKED; Phase 6 \\/ Slice 6\\.3 NEXT\\*\\*/",
              "/Status: \\*\\*active delivery plan — Slice 5\\.3 BLOCKED; Phase 6 \\/ Slice 6\\.4 NEXT\\*\\*/",
          )
          replace_once(
              "web/tests/release-hardening.test.mjs",
              "/### 6\\.3 Collections become playbooks\\n\\nStatus: \\*\\*NEXT\\*\\*/",
              "/### 6\\.3 Collections become playbooks\\n\\nStatus: \\*\\*DONE\\*\\*/",
          )
          replace_once(
              "web/tests/release-hardening.test.mjs",
              "  assert.match(\n    slices,\n    /ten selected references, four rejected directions, a deterministic `tessli\\.board-research-pack\\.v1` handoff/i,\n  );",
              "  assert.match(\n    plan,\n    /### 6\\.4 For AI\\n\\nStatus: \\*\\*NEXT\\*\\*/,\n  );\n  assert.match(\n    slices,\n    /ten selected references, four rejected directions, a deterministic `tessli\\.board-research-pack\\.v1` handoff/i,\n  );",
          )
          PY
          cd web
          npx prettier --write ../build-slices.md ../docs/product-plan-v2.md ../docs/slices/6.3-collections-to-playbooks.md tests/release-hardening.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../build-slices.md ../docs/product-plan-v2.md ../docs/slices/6.3-collections-to-playbooks.md tests/release-hardening.test.mjs
          git commit -m "docs: complete Slice 6.3 and advance 6.4"
          git push origin HEAD:feat/collections-to-playbooks
