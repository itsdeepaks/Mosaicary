name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "lib_data/tessli-launch-collections.json"
      - "docs/slices/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-to-playbooks

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Commit generated Playbook contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/catalogue-lib.mjs")
          source = path.read_text()
          old = '''  const categories = CATEGORY_DEFINITIONS.map(
            ({ sourceLabel, expectedCount, ...category }) => ({
              id: category.id,
              label: sourceLabel,
              shortLabel: category.shortLabel,
              description: category.description,
              icon: category.icon,
              order: category.order,
            }),
          );'''
          new = '''  const categories = CATEGORY_DEFINITIONS.map((category) => ({
            id: category.id,
            label: category.sourceLabel,
            shortLabel: category.shortLabel,
            description: category.description,
            icon: category.icon,
            order: category.order,
          }));'''
          if old not in source:
              raise SystemExit("Expected category projection block not found")
          path.write_text(source.replace(old, new))
          PY
          npm run catalogue:generate
          npx prettier --write scripts/catalogue-lib.mjs tests/public-representations.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json data/catalogue-validation.json scripts/catalogue-lib.mjs tests/public-representations.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Playbook generated contract"
            git push origin HEAD:feat/collections-to-playbooks
          fi
