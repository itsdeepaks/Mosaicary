name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/**"
      - "docs/data-and-media-contract.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".gitignore"
      - "README.md"
      - "build-slices.md"
      - "lib_data/design-resource-library-295.csv"
      - "lib_data/tessli-launch-collections.json"
      - "schemas/**"
      - "docs/data-and-media-contract.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/global-navigation-naming-cleanup

      - name: Advance Product Plan v2 after Slice 6.1
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = {
              Path("build-slices.md"): {
                  "Status: **active delivery plan — Slice 5.3 BLOCKED; Phase 6 / Slice 6.1 NEXT**":
                      "Status: **active delivery plan — Slice 5.3 BLOCKED; Phase 6 / Slice 6.3 NEXT**",
                  "|     6 | Homepage, Navigation, Playbooks, and For AI | ACTIVE   | 6.1 NEXT                   |":
                      "|     6 | Homepage, Navigation, Playbooks, and For AI | ACTIVE   | 6.3 NEXT                   |",
                  "| 6.1  | Global navigation and naming cleanup                  | NEXT     | 2.2                     | —                                                                    |":
                      "| 6.1  | Global navigation and naming cleanup                  | DONE     | 2.2                     | `docs/slices/6.1-global-navigation-cleanup.md`, PR #92                |",
                  "| 6.2  | Curated homepage built around proven workflow         | PLANNED  | 5.4, 6.1                | —                                                                    |":
                      "| 6.2  | Curated homepage built around proven workflow         | BLOCKED  | 5.4, 6.1                | —                                                                    |",
                  "| 6.3  | Collections-to-playbooks conversion                   | PLANNED  | 3.3, 4.2                | —                                                                    |":
                      "| 6.3  | Collections-to-playbooks conversion                   | NEXT     | 3.3, 4.2                | —                                                                    |",
                  "### ACTIVE — Phase 5 Real OSS Proof Project":
                      "### BLOCKED — Phase 5 Real OSS Proof Project",
                  "Only working routes enter public navigation. Homepage redesign follows the proven research loop. Collections become staged playbooks. For AI documents real tools, setup, coverage, governance, and exports.":
                      "Slice 6.1 delivered one truthful public shell: Browse and Collections as primary routes, Search and Saved as utilities, About in the footer, no premature Sign in or For AI promotion, and responsive browser evidence. Homepage redesign remains blocked on Phase 5. Collections become staged playbooks next; For AI follows as a working product route. Evidence: `docs/slices/6.1-global-navigation-cleanup.md`, PR #92.",
                  "After Slice 5.3 merges, refresh `main` and begin Phase 6 / Slice 6.1 on a new branch. Slice 5.4 and Slice 6.2 remain blocked until a genuine completed human-review artifact is returned.":
                      "After Slice 6.1 merges, refresh `main` and begin Phase 6 / Slice 6.3 on a new branch. Slice 5.4 and Slice 6.2 remain blocked until a genuine completed human-review artifact is returned."
              },
              Path("docs/product-plan-v2.md"): {
                  "## 10. Phase 6 — Homepage, Navigation, Playbooks, and For AI\n\nStatus: **PLANNED**":
                      "## 10. Phase 6 — Homepage, Navigation, Playbooks, and For AI\n\nStatus: **ACTIVE**",
                  "### 6.1 Global navigation and naming\n\nStatus: **NEXT**":
                      "### 6.1 Global navigation and naming\n\nStatus: **DONE**",
                  "Primary navigation:\n\n```text\nBrowse | Collections | For AI\n```":
                      "Primary navigation:\n\n```text\nBrowse | Collections\n```",
                  "- remove duplicated Resources/Full Reference/Explore naming;\n- About moves to secondary/footer navigation;\n- Sign in remains absent until Phase 8 works.\n\n### 6.2 Curated homepage":
                      "- removed duplicated Resources/Full Reference/Explore naming from the public shell;\n- About moved to secondary/footer navigation;\n- Sign in remains absent until Phase 8 works;\n- For AI remains absent until Slice 6.4 supplies a working route;\n- responsive desktop/mobile browser evidence passed.\n\nEvidence: `docs/slices/6.1-global-navigation-cleanup.md`, PR #92.\n\n### 6.2 Curated homepage\n\nStatus: **BLOCKED — REQUIRES COMPLETED PHASE 5 OUTCOME**",
                  "### 6.3 Collections become playbooks\n\n- outcome and audience;":
                      "### 6.3 Collections become playbooks\n\nStatus: **NEXT**\n\n- outcome and audience;",
                  "### 6.4 For AI\n\n- current seven MCP tools;":
                      "### 6.4 For AI\n\nStatus: **PLANNED**\n\n- current seven MCP tools;"
              },
              Path("web/tests/release-hardening.test.mjs"): {
                  '["6.1", "Global navigation and naming cleanup", "NEXT", "2.2", "—"],':
                      '[\n      "6.1",\n      "Global navigation and naming cleanup",\n      "DONE",\n      "2.2",\n      "`docs/slices/6.1-global-navigation-cleanup.md`, PR #92",\n    ],\n    [\n      "6.2",\n      "Curated homepage built around proven workflow",\n      "BLOCKED",\n      "5.4, 6.1",\n      "—",\n    ],\n    [\n      "6.3",\n      "Collections-to-playbooks conversion",\n      "NEXT",\n      "3.3, 4.2",\n      "—",\n    ],',
                  '/Status: \\*\\*active delivery plan — Slice 5\\.3 BLOCKED; Phase 6 \\/ Slice 6\\.1 NEXT\\*\\*/,':
                      '/Status: \\*\\*active delivery plan — Slice 5\\.3 BLOCKED; Phase 6 \\/ Slice 6\\.3 NEXT\\*\\*/,',
                  '/### 6\\.1 Global navigation and naming\\n\\nStatus: \\*\\*NEXT\\*\\*/,':
                      '/### 6\\.1 Global navigation and naming\\n\\nStatus: \\*\\*DONE\\*\\*/,',
                  '  assert.match(\n    plan,\n    /### 6\\.1 Global navigation and naming\\n\\nStatus: \\*\\*DONE\\*\\*/,\n  );':
                      '  assert.match(\n    plan,\n    /### 6\\.1 Global navigation and naming\\n\\nStatus: \\*\\*DONE\\*\\*/,\n  );\n  assert.match(\n    plan,\n    /### 6\\.2 Curated homepage\\n\\nStatus: \\*\\*BLOCKED — REQUIRES COMPLETED PHASE 5 OUTCOME\\*\\*/,\n  );\n  assert.match(\n    plan,\n    /### 6\\.3 Collections become playbooks\\n\\nStatus: \\*\\*NEXT\\*\\*/,\n  );'
              }
          }

          for path, replacements in updates.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  if old in text:
                      if text.count(old) != 1:
                          raise SystemExit(f"Expected exactly one match in {path}: {old!r}")
                      text = text.replace(old, new)
                  elif new not in text:
                      raise SystemExit(f"Neither old nor new state found in {path}: {old!r}")
              path.write_text(text, encoding="utf-8", newline="\n")
          PY

          cd web
          npx prettier --write tests/release-hardening.test.mjs
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md docs/product-plan-v2.md web/tests/release-hardening.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "docs: advance Phase 6 to playbooks"
            git push origin HEAD:feat/global-navigation-naming-cleanup
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify approved hero asset
        shell: bash
        run: |
          test -s public/brand/tessli-hero-geometry.webp
          echo "0bf8d0fcea17d10b041b2bc08422679acf4fffd7c54fc70c1b18aba9d1d85583  public/brand/tessli-hero-geometry.webp" | sha256sum -c -

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check catalogue drift
        run: npm run catalogue:check

      - name: Build
        run: npm run build

      - name: Measure OSS proof handoff
        run: node scripts/measure-oss-proof-handoff.mjs

      - name: Run canonical route and browser matrix
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/tessli-next.log 2>&1 &
          server_pid=$!
          chrome_pid=""
          cleanup() {
            if [ -n "$chrome_pid" ]; then kill "$chrome_pid" 2>/dev/null || true; fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/resources > /tmp/tessli-resources.html
          grep -q "Browse design sources" /tmp/tessli-resources.html
          grep -q 'data-browse-view="cards"' /tmp/tessli-resources.html
          grep -q "Inspect Tessli profile" /tmp/tessli-resources.html

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/resources/designindex > /tmp/tessli-profile.html
          grep -q "What this profile supports" /tmp/tessli-profile.html

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          mkdir -p artifacts/responsive-ui artifacts/search-browser artifacts/phase-1-release artifacts/oss-proof-candidate artifacts/oss-human-review artifacts/global-navigation
          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-allow-origins=* \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/tessli-cdp \
            about:blank > artifacts/search-browser/chrome.log 2>&1 &
          chrome_pid=$!

          node tests/explore-search-browser.mjs 2>&1 | tee artifacts/search-browser/interaction.log
          node tests/discovery-controls-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/explore-results-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/resource-card-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/collections-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/full-reference-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/saved-resources-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/release-gate-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/oss-homepage-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/oss-human-review-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log
          node tests/global-navigation-browser.mjs 2>&1 | tee -a artifacts/search-browser/interaction.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessli-browser-diagnostics
          path: |
            web/artifacts/search-browser/*
            web/artifacts/responsive-ui/*.png
            web/artifacts/phase-1-release/*.png
            web/artifacts/oss-proof-candidate/*.png
            web/artifacts/oss-human-review/*.png
            web/artifacts/global-navigation/*.png
            web/artifacts/oss-proof-metrics.json
          if-no-files-found: warn
          retention-days: 7
