name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - "README.md"
      - "build-slices.md"
      - "docs/product-plan-v2.md"
      - "docs/slices/**"
      - "scripts/complete-slice-1.4.py"

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/priority-profile-expansion-batch-2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Complete and format Slice 1.4 authority
        shell: bash
        run: |
          python -m py_compile scripts/complete-slice-1.4.py
          python scripts/complete-slice-1.4.py
          cd web
          npx prettier --write \
            ../README.md \
            ../build-slices.md \
            ../docs/product-plan-v2.md \
            ../docs/slices/1.4-priority-source-profile-expansion-batch-2.md \
            tests/release-hardening.test.mjs
          cd ..
          git config user.name "tessli-agent"
          git config user.email "actions@users.noreply.github.com"
          git add README.md build-slices.md docs/product-plan-v2.md docs/slices/1.4-priority-source-profile-expansion-batch-2.md web/tests/release-hardening.test.mjs
          git commit -m "docs: complete priority profile batch 2"
          git push origin HEAD:feat/priority-profile-expansion-batch-2
