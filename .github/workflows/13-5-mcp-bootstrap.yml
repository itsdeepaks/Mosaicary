name: Retire Slice 13.5 MCP bootstrap

on:
  push:
    branches:
      - feat/native-tessli-mcp
    paths:
      - .github/workflows/13-5-mcp-bootstrap.yml

permissions:
  contents: write

jobs:
  remove-helper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/native-tessli-mcp
          fetch-depth: 0

      - name: Remove one-use workflow
        shell: bash
        run: |
          git rm .github/workflows/13-5-mcp-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove one-use MCP bootstrap workflow"
          git push origin HEAD:feat/native-tessli-mcp
