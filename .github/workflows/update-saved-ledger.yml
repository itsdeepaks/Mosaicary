name: Update saved workspace ledger

on:
  push:
    branches:
      - feat/saved-workspace-refinement
    paths:
      - ".github/workflows/update-saved-ledger.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saved-workspace-refinement
      - name: Update Product Plan v2 ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path("build-slices.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "Status: **active delivery plan — Phase 3 / Slice 3.2 NEXT**": "Status: **active delivery plan — Phase 3 / Slice 3.3 NEXT**",
              "| 3 | Local Saved and Project Boards | ACTIVE | 3.2 NEXT |": "| 3 | Local Saved and Project Boards | ACTIVE | 3.3 NEXT |",
              "| 3.2 | Saved workspace search/filter refinement | NEXT | 3.1 | — |": "| 3.2 | Saved workspace search/filter refinement | DONE | 3.1 | `docs/slices/3.2-saved-workspace-refinement.md`, PR #83 |",
              "| 3.3 | Local project Boards and notes | PLANNED | 3.1 | — |": "| 3.3 | Local project Boards and notes | NEXT | 3.1, 3.2 | — |",
              "### Slice 3.2 Saved workspace refinement\n\nSearch, filter, sort, remove, and undo with accessible empty and dynamic states.": "### DONE — Slice 3.2 Saved workspace refinement\n\nDelivered:\n\n- search across saved source name, domain, description, use case, and tags;\n- filters limited to categories and access models present in the saved set;\n- recent, A–Z, and Z–A sorting without changing persisted order;\n- truthful counts, no-match state, and accessible filter reset;\n- individual removal undo plus retained clear-all confirmation and undo;\n- responsive labelled controls with 44px targets and visible focus;\n- the existing stable-ID local store, legacy migration, and synchronization boundaries unchanged;\n- `docs/slices/3.2-saved-workspace-refinement.md`;\n- PR #83."
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing expected ledger text: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md
          git diff --cached --quiet || git commit -m "docs: record saved workspace refinement"
          git push origin HEAD:feat/saved-workspace-refinement

