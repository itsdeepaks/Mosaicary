name: Resource preview pilot format helper

on:
  push:
    branches:
      - agent/resource-preview-storage-pilot
    paths:
      - ".github/workflows/resource-preview-pilot-format-helper.yml"
      - "web/scripts/capture-resource-preview-pilot.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/resource-preview-pilot-format-helper.yml"
      - "web/scripts/capture-resource-preview-pilot.mjs"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Produce canonical formatting
        shell: bash
        run: |
          mkdir -p artifacts/pilot-format
          cd web
          npx prettier scripts/capture-resource-preview-pilot.mjs \
            > ../artifacts/pilot-format/capture-resource-preview-pilot.mjs
          npx prettier --check ../artifacts/pilot-format/capture-resource-preview-pilot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: resource-preview-pilot-formatted-script
          path: artifacts/pilot-format/capture-resource-preview-pilot.mjs
          if-no-files-found: error
          retention-days: 1
