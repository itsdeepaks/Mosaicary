name: Format Browse tests

on:
  push:
    branches:
      - feat/canonical-browse
    paths:
      - ".github/workflows/format-browse-tests.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-browse
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx prettier --write tests/full-reference.test.mjs tests/discovery-controls.test.mjs
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/tests/full-reference.test.mjs web/tests/discovery-controls.test.mjs
          git commit -m "style: format canonical Browse tests"
          git push origin HEAD:feat/canonical-browse
