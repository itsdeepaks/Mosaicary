name: Update Slice 3.1 ledger

on:
  push:
    branches:
      - feat/universal-local-save
    paths:
      - ".github/workflows/update-slice-3-1-ledger.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-local-save
      - name: Update Product Plan v2 ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path("build-slices.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "Status: **active delivery plan — Phase 3 / Slice 3.1 NEXT**":
                  "Status: **active delivery plan — Phase 3 / Slice 3.2 NEXT**",
              "| 3 | Local Saved and Project Boards | ACTIVE | 3.1 NEXT |":
                  "| 3 | Local Saved and Project Boards | ACTIVE | 3.2 NEXT |",
              "| 3.1 | Universal browser-local Save | NEXT | 2.2, 2.3 | — |":
                  "| 3.1 | Universal browser-local Save | DONE | 2.2, 2.3 | `docs/slices/3.1-universal-local-save.md`, PR #82 |",
              "| 3.2 | Saved workspace search/filter refinement | PLANNED | 3.1 | — |":
                  "| 3.2 | Saved workspace search/filter refinement | NEXT | 3.1 | — |",
              "### NEXT — Slice 3.1 Universal browser-local Save":
                  "### DONE — Slice 3.1 Universal browser-local Save",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing expected ledger text: {old}")
              text = text.replace(old, new, 1)

          marker = "### Slice 3.2 Saved workspace refinement"
          evidence = """Completion evidence:\n\n- one stable-ID browser-local store across Browse, Source Detail, collection resources, and Saved;\n- legacy Tessli and Mosaicary URL-list migration retained;\n- same-document and cross-tab synchronization;\n- accessible persistent Save controls on every collection resource;\n- no account, network, cloud, catalogue, schema, or dependency change;\n- `docs/slices/3.1-universal-local-save.md`;\n- PR #82.\n\n"""
          if marker not in text:
              raise SystemExit("Missing Slice 3.2 marker")
          text = text.replace(marker, evidence + marker, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md
          git commit -m "docs: complete universal local save slice"
          git push origin HEAD:feat/universal-local-save
