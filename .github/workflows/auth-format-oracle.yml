name: Auth Format Oracle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-auth-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/credential-ready-auth-shell
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply repository formatter
        run: npx prettier components/auth-shell/auth-shell.tsx tests/auth-shell.test.mjs --write
      - name: Commit formatted files
        working-directory: .
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/components/auth-shell/auth-shell.tsx web/tests/auth-shell.test.mjs
          git commit -m "style: format credential-ready auth shell"
          git push origin HEAD:feat/credential-ready-auth-shell
