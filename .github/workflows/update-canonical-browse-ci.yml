name: Update canonical Browse CI

on:
  push:
    branches:
      - feat/canonical-browse
    paths:
      - ".github/workflows/update-canonical-browse-ci.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-browse
      - name: Replace retired Full Reference smoke assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/web-ci.yml')
          text = path.read_text()
          replacements = {
              "grep -q 'data-result-count=\"295\"' /tmp/tessli-home.html": "grep -q 'data-result-count=\"12\"' /tmp/tessli-home.html",
              "grep -q 'data-visible-result-count=\"48\"' /tmp/tessli-home.html": "grep -q 'data-visible-result-count=\"12\"' /tmp/tessli-home.html",
              "grep -q 'data-full-reference-page=\"true\"' /tmp/tessli-resources.html": "grep -q 'data-browse-view=\"cards\"' /tmp/tessli-resources.html",
              "grep -q 'data-reference-table=\"true\"' /tmp/tessli-resources.html": "grep -q 'Inspect Tessli profile' /tmp/tessli-resources.html",
              'grep -q "Source-backed, not ranked" /tmp/tessli-resources.html': 'grep -q "Browse design sources" /tmp/tessli-resources.html',
              'echo "Checking lab, Explore, resource cards, Collections, and Full Reference at ${width}px"': 'echo "Checking lab, homepage preview, resource cards, Collections, and Browse at ${width}px"',
              "grep -q 'data-result-count=\"295\"' \\\n              \"artifacts/responsive-ui/explore-$width.html\"": "grep -q 'data-result-count=\"12\"' \\\n              \"artifacts/responsive-ui/explore-$width.html\"",
              "grep -q 'data-visible-result-count=\"48\"' \\\n              \"artifacts/responsive-ui/explore-$width.html\"": "grep -q 'data-visible-result-count=\"12\"' \\\n              \"artifacts/responsive-ui/explore-$width.html\"",
              "grep -q 'data-full-reference-page=\"true\"' \\\n              \"artifacts/responsive-ui/full-reference-$width.html\"": "grep -q 'data-browse-view=\"cards\"' \\\n              \"artifacts/responsive-ui/full-reference-$width.html\"",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected workflow text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit CI contract update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/web-ci.yml
          git commit -m "test: align Web CI with canonical Browse"
          git push origin HEAD:feat/canonical-browse
