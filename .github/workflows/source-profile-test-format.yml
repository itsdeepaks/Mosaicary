name: Source profile test formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/source-profile-test-format.yml"
      - "web/tests/source-profile-contract.test.mjs"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Format focused test
        working-directory: web
        run: npx prettier --write tests/source-profile-contract.test.mjs

      - name: Upload canonical test
        uses: actions/upload-artifact@v4
        with:
          name: source-profile-test-format
          path: web/tests/source-profile-contract.test.mjs
          if-no-files-found: error
          retention-days: 2
