name: Source profile contract inspection

on:
  push:
    branches:
      - feat/source-profile-contract
    paths:
      - ".github/workflows/source-profile-contract-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect relevant source contract files
        shell: bash
        run: |
          mkdir -p artifacts/source-profile-contract-inspect
          for path in \
            schemas \
            web/data/intelligence-profiles \
            web/data/catalogue.json \
            web/lib \
            web/mcp \
            web/scripts \
            web/tests \
            web/package.json; do
            if [ -e "$path" ]; then
              cp -R --parents "$path" artifacts/source-profile-contract-inspect/
            fi
          done
          find artifacts/source-profile-contract-inspect -type f \
            | sort \
            > artifacts/source-profile-contract-inspect/file-list.txt

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-profile-contract-inspect
          path: artifacts/source-profile-contract-inspect
          if-no-files-found: error
          retention-days: 2
