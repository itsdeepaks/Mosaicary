name: Validate local Supabase client slice

on:
  push:
    branches: [feat/local-supabase-clients]
    paths:
      - ".github/workflows/validate-local-supabase-clients.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-supabase-clients
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Run focused Supabase contract tests
        working-directory: web
        run: node --test tests/supabase-client-contract.test.mjs tests/scaffold.test.mjs

      - name: Check formatting
        working-directory: web
        run: npm run format:check

      - name: Check types
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      - name: Check catalogue drift
        working-directory: web
        run: npm run catalogue:check

      - name: Build
        working-directory: web
        run: npm run build

      - name: Verify focused cumulative diff
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD \
            | grep -v '^.github/workflows/validate-local-supabase-clients.yml$' \
            | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          build-slices.md
          docs/slices/10.1a-local-supabase-client-contract.md
          web/.env.example
          web/lib/supabase/browser.ts
          web/lib/supabase/config.ts
          web/lib/supabase/database.types.ts
          web/lib/supabase/server.ts
          web/package-lock.json
          web/package.json
          web/tests/scaffold.test.mjs
          web/tests/supabase-client-contract.test.mjs
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Remove validation workflow
        run: rm .github/workflows/validate-local-supabase-clients.yml

      - name: Commit validated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-local-supabase-clients.yml
          git commit -m "chore: complete local Supabase client validation"
          git push origin HEAD:feat/local-supabase-clients
