name: Debug OSS human-review contract

on:
  push:
    branches:
      - proof/oss-homepage-human-review
    paths:
      - ".github/workflows/debug-oss-human-review.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/oss-homepage-human-review
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node --test --test-reporter=spec tests/oss-human-review-contract.test.mjs
