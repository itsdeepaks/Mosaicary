name: Diagnose local Supabase client slice

on:
  push:
    branches: [feat/local-supabase-clients]
    paths:
      - ".github/workflows/diagnose-local-supabase-clients.yml"

permissions:
  contents: write

concurrency:
  group: diagnose-local-supabase-clients
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-supabase-clients
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run and record validation
        shell: bash
        run: |
          set +e
          report="docs/slices/10.1a-validation-diagnostic.txt"
          : > "$report"

          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            echo "## $name" >> "$report"
            "$@" > "$log" 2>&1
            status=$?
            echo "status=$status" >> "$report"
            cat "$log" >> "$report"
            echo >> "$report"
            return $status
          }

          cd web
          npm pkg set engines.node=">=22.0.0"
          run_check install npm install --save-exact @supabase/ssr@latest @supabase/supabase-js@latest
          install_status=$?
          cd ..

          python - <<'PY' >> "$report" 2>&1
          import subprocess
          from pathlib import Path

          path = Path("build-slices.md")
          text = subprocess.check_output(
              ["git", "show", "origin/main:build-slices.md"],
              text=True,
              encoding="utf-8",
          )
          old = "\n".join([
              "| 10.1 | Supabase project integration and auth clients | BLOCKED | Phase 1, credentials |",
              "| 10.2 | Auth shell, password, OTP, and Google | PLANNED | 10.1 |",
              "| 11.1 | User-data schema and RLS | PLANNED | 10.1 |",
          ])
          new = "\n".join([
              "| 10.1a | Local Supabase SSR clients and environment contract | DONE | Phase 1 |",
              "| 10.1b | Supabase cloud project link and client smoke test | BLOCKED | 10.1a, project approval |",
              "| 10.2 | Auth shell, password, OTP, and Google | PLANNED | 10.1b |",
              "| 11.1 | User-data schema and RLS | PLANNED | 10.1b |",
          ])
          if old not in text:
              raise SystemExit("Supabase slice ledger block not found on main")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ledger_status=$?

          cd web
          run_check format npx prettier --write package.json lib/supabase/config.ts lib/supabase/database.types.ts lib/supabase/browser.ts lib/supabase/server.ts tests/supabase-client-contract.test.mjs ../docs/slices/10.1a-local-supabase-client-contract.md
          format_status=$?
          run_check focused node --test tests/supabase-client-contract.test.mjs
          focused_status=$?
          run_check format-check npm run format:check
          format_check_status=$?
          run_check typecheck npm run typecheck
          typecheck_status=$?
          run_check lint npm run lint
          lint_status=$?
          run_check test npm test
          test_status=$?
          run_check catalogue npm run catalogue:check
          catalogue_status=$?
          run_check build npm run build
          build_status=$?
          cd ..

          echo "## summary" >> "$report"
          printf '%s\n' \
            "install=$install_status" \
            "ledger=$ledger_status" \
            "format=$format_status" \
            "focused=$focused_status" \
            "format_check=$format_check_status" \
            "typecheck=$typecheck_status" \
            "lint=$lint_status" \
            "test=$test_status" \
            "catalogue=$catalogue_status" \
            "build=$build_status" >> "$report"

          rm -f .github/workflows/finalize-local-supabase-clients.yml
          rm -f .github/workflows/diagnose-local-supabase-clients.yml

          all_statuses=(
            "$install_status" "$ledger_status" "$format_status" "$focused_status"
            "$format_check_status" "$typecheck_status" "$lint_status"
            "$test_status" "$catalogue_status" "$build_status"
          )
          all_passed=true
          for status in "${all_statuses[@]}"; do
            if [ "$status" -ne 0 ]; then
              all_passed=false
            fi
          done
          if [ "$all_passed" = true ]; then
            rm -f "$report"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record local Supabase client validation"
          git push origin HEAD:feat/local-supabase-clients
