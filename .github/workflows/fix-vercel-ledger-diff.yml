name: Fix paused Vercel ledger diff

on:
  push:
    branches: [chore/pause-vercel-auto-deployments]
    paths:
      - ".github/workflows/fix-vercel-ledger-diff.yml"

permissions:
  contents: write

jobs:
  fix-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/pause-vercel-auto-deployments
          fetch-depth: 0

      - name: Restore main formatting and add one row
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path = Path("build-slices.md")
          text = subprocess.check_output(
              ["git", "show", "origin/main:build-slices.md"],
              text=True,
              encoding="utf-8",
          )
          anchor = "| 9.2 | Phase 1 release hardening and deployment runbook | DONE | 5.2, 6.2, 7.2, 8.2, 9.1 |"
          row = "| 9.2a | Pause automatic Vercel Git deployments during local and CI development | DONE | 9.2 |"
          if anchor not in text:
              raise SystemExit("Slice 9.2 ledger anchor not found on main")
          path.write_text(text.replace(anchor, anchor + "\n" + row, 1), encoding="utf-8")

      - name: Remove repair workflow
        run: rm .github/workflows/fix-vercel-ledger-diff.yml

      - name: Commit focused ledger diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md .github/workflows/fix-vercel-ledger-diff.yml
          git commit -m "fix: keep Vercel pause ledger diff focused"
          git push origin HEAD:chore/pause-vercel-auto-deployments
