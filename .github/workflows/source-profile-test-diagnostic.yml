name: Source profile test diagnostic

on:
  push:
    branches:
      - feat/source-profile-contract
    paths:
      - ".github/workflows/source-profile-test-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Run complete test command and retain output
        id: tests
        working-directory: web
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ../source-profile-test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: source-profile-test-diagnostic
          path: source-profile-test-output.log
          if-no-files-found: error
          retention-days: 2

      - name: Preserve failing status
        if: steps.tests.outputs.exit_status != '0'
        run: exit 1
