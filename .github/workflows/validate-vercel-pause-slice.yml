name: Validate paused Vercel deployment slice

on:
  push:
    branches: [chore/pause-vercel-auto-deployments]
    paths:
      - ".github/workflows/validate-vercel-pause-slice.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/pause-vercel-auto-deployments
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Check formatting
        working-directory: web
        run: npm run format:check

      - name: Check types
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      - name: Check catalogue drift
        working-directory: web
        run: npm run catalogue:check

      - name: Build
        working-directory: web
        run: npm run build

      - name: Verify focused cumulative diff
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD \
            | grep -v '^.github/workflows/validate-vercel-pause-slice.yml$' \
            | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          README.md
          build-slices.md
          docs/slices/9.2a-pause-vercel-auto-deployments.md
          vercel.json
          web/tests/vercel-deployment-policy.test.mjs
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Remove validation workflow
        run: rm .github/workflows/validate-vercel-pause-slice.yml

      - name: Commit validated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-vercel-pause-slice.yml
          git commit -m "chore: complete paused Vercel deployment validation"
          git push origin HEAD:chore/pause-vercel-auto-deployments
