name: One-use media ledger helper

on:
  push:
    branches:
      - codex/media-discovery-review-tooling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/media-discovery-review-tooling
          fetch-depth: 0

      - name: Keep blocked slice as next
        shell: python
        run: |
          from pathlib import Path

          path = Path("build-slices.md")
          text = path.read_text(encoding="utf-8")
          old = "| 5.3b | Media discovery and review tooling | DONE | 5.3a |"
          new = "| 5.3b | Media discovery and review tooling | NEXT | 5.3a |"
          if text.count(old) != 1:
              raise SystemExit("Expected completed 5.3b status row was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit ledger correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md
          git commit -m "docs: keep blocked media slice as next"
          git push origin HEAD:codex/media-discovery-review-tooling
