name: Format local project boards

on:
  push:
    branches:
      - feat/local-project-boards
    paths:
      - "web/components/project-boards/**"
      - ".github/workflows/format-local-project-boards.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-project-boards
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx prettier --write components/project-boards
        working-directory: web
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/project-boards
          git commit -m "style: format local project boards"
          git push origin HEAD:feat/local-project-boards
