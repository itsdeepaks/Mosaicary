name: Browse contract inspection

on:
  push:
    branches:
      - docs/canonical-browse-contract
    paths:
      - ".github/workflows/browse-contract-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect current Browse implementation and tests
        shell: bash
        run: |
          mkdir -p artifacts/browse-contract-inspect
          for path in \
            docs/product-direction.md \
            PRD.md \
            build-slices.md \
            design.md \
            web/app/resources \
            web/app/page.tsx \
            web/components \
            web/lib \
            web/tests \
            web/package.json; do
            if [ -e "$path" ]; then
              cp -R --parents "$path" artifacts/browse-contract-inspect/
            fi
          done
          find artifacts/browse-contract-inspect -type f | sort \
            > artifacts/browse-contract-inspect/file-list.txt

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: browse-contract-inspect
          path: artifacts/browse-contract-inspect
          if-no-files-found: error
          retention-days: 2
