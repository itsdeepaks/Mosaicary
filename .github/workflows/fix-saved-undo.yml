name: Fix saved undo merge behavior

on:
  push:
    branches:
      - feat/saved-workspace-refinement
    paths:
      - ".github/workflows/fix-saved-undo.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saved-workspace-refinement
      - name: Preserve intervening save changes during undo
        shell: python
        run: |
          from pathlib import Path

          path = Path("web/components/saved-resources/saved-resources-experience.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''  const restoreResource = useCallback(
    (resourceId: string, previousIds: readonly string[]) => {
      writeSavedResourceIds(previousIds);
      setSavedResourceIds(previousIds);
      const resource = resourcesById.get(resourceId);
      setAnnouncement(`${resource?.name ?? "Resource"} restored.`);
    },
    [resourcesById],
  );
'''
          new = '''  const restoreResource = useCallback(
    (resourceId: string) => {
      setSavedResourceIds((currentIds) => {
        const restoredIds = currentIds.includes(resourceId)
          ? currentIds
          : [...currentIds, resourceId];
        writeSavedResourceIds(restoredIds);
        return restoredIds;
      });
      const resource = resourcesById.get(resourceId);
      setAnnouncement(`${resource?.name ?? "Resource"} restored.`);
    },
    [resourcesById],
  );

  const restoreClearedResources = useCallback(
    (resourceIds: readonly string[]) => {
      setSavedResourceIds((currentIds) => {
        const restoredIds = Array.from(new Set([...resourceIds, ...currentIds]));
        writeSavedResourceIds(restoredIds);
        return restoredIds;
      });
      setClearedResourceIds(null);
      setAnnouncement(`${resourceCountLabel(resourceIds.length)} restored.`);
    },
    [],
  );
'''
          if old not in text:
              raise SystemExit("restoreResource block not found")
          text = text.replace(old, new, 1)
          text = text.replace("      const previous = savedResourceIds;\n", "", 1)
          text = text.replace("                onUndo: () => restoreResource(resourceId, previous),", "                onUndo: () => restoreResource(resourceId),", 1)
          old_clear = '''        onUndo: () => {
          writeSavedResourceIds(previous);
          setSavedResourceIds(previous);
          setClearedResourceIds(null);
          setAnnouncement(`${resourceCountLabel(previous.length)} restored.`);
        },
'''
          new_clear = '''        onUndo: () => restoreClearedResources(previous),
'''
          if old_clear not in text:
              raise SystemExit("clear toast undo block not found")
          text = text.replace(old_clear, new_clear, 1)
          old_undo = '''  const undoClear = () => {
    if (!clearedResourceIds) return;
    writeSavedResourceIds(clearedResourceIds);
    setSavedResourceIds(clearedResourceIds);
    setClearedResourceIds(null);
    setAnnouncement(
      `${resourceCountLabel(clearedResourceIds.length)} restored.`,
    );
  };
'''
          new_undo = '''  const undoClear = () => {
    if (!clearedResourceIds) return;
    restoreClearedResources(clearedResourceIds);
  };
'''
          if old_undo not in text:
              raise SystemExit("undoClear block not found")
          text = text.replace(old_undo, new_undo, 1)
          text = text.replace("    [resourcesById, restoreResource, savedResourceIds],", "    [resourcesById, restoreResource, savedResourceIds],", 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("web/tests/saved-resources-page.test.mjs")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = test_text.replace(
              '  assert.match(experience, /onUndo: \\(\\) => restoreResource/);',
              '  assert.match(experience, /onUndo: \\(\\) => restoreResource/);\n  assert.match(experience, /setSavedResourceIds\\(\\(currentIds\\) =>/);\n  assert.match(experience, /new Set\\(\\[\\.\\.\\.resourceIds, \\.\\.\\.currentIds\\]\\)/);',
              1,
          )
          test_path.write_text(test_text, encoding="utf-8")
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx prettier --write components/saved-resources/saved-resources-experience.tsx tests/saved-resources-page.test.mjs
        working-directory: web
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/saved-resources/saved-resources-experience.tsx web/tests/saved-resources-page.test.mjs
          git diff --cached --quiet || git commit -m "fix: preserve intervening saves during undo"
          git push origin HEAD:feat/saved-workspace-refinement
