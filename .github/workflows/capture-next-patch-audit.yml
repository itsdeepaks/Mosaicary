name: Capture Next patch audit

on:
  push:
    branches: [feat/local-supabase-clients]
    paths:
      - ".github/workflows/capture-next-patch-audit.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-supabase-clients

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Capture patched production audit
        shell: bash
        run: |
          set +e
          report="$GITHUB_WORKSPACE/docs/slices/10.1a-next-patch-audit.json"
          cd web
          npm install --save-exact next@16.2.12 > /tmp/next-install.log 2>&1
          npm install --save-dev --save-exact eslint-config-next@16.2.12 > /tmp/eslint-install.log 2>&1
          npm audit --omit=dev --json > "$report" 2>&1
          status=$?
          cd ..
          echo "$status" > docs/slices/10.1a-next-patch-audit.status
          rm -f docs/slices/10.1a-next-patch-install.log
          rm -f .github/workflows/capture-next-patch-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: capture patched Next production audit"
          git push origin HEAD:feat/local-supabase-clients
