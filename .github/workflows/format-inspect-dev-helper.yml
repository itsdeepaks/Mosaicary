name: One-use inspect-dev formatter

on:
  push:
    branches:
      - chore/format-inspect-dev

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/format-inspect-dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Format inspect-dev
        working-directory: web
        run: npx prettier --write scripts/inspect-dev.mjs

      - name: Commit exact formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/scripts/inspect-dev.mjs
          if git diff --cached --quiet; then
            echo "No formatter changes required."
          else
            git commit -m "style: apply exact Prettier output"
            git push origin HEAD:chore/format-inspect-dev
          fi
