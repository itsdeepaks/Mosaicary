name: One-use reviewed media pilot branch finalizer

on:
  push:
    branches:
      - codex/reviewed-media-discovery-pilot

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/reviewed-media-discovery-pilot
          fetch-depth: 0

      - name: Record completed slice
        shell: python
        run: |
          from pathlib import Path

          ledger = Path("build-slices.md")
          text = ledger.read_text(encoding="utf-8")
          anchor = "| 5.3b | Media discovery and review tooling | DONE | 5.3a |"
          row = "| 5.3c | Reviewed media discovery pilot | DONE | 5.3b |"
          if row not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("Expected 5.3b ledger anchor was not found exactly once")
              text = text.replace(anchor, f"{anchor}\n{row}", 1)
          ledger.write_text(text, encoding="utf-8")

          note = Path("docs/slices/5.3c-reviewed-media-discovery-pilot.md")
          note.write_text("""# Slice 5.3c — Reviewed media discovery pilot

Status: **implementation complete; exact-head CI pending**  
Base commit: `cd3d47cf8fc8502e618e86340cc2baa5c1533481`

## Goal

Run the explicit 5.3b discovery workflow for exactly three asset-library resources, inspect every discovered raster manually, and publish only suitable reviewed records through Tessli's approved-media source.

## Reviewed resources

| Resource | Discovery result | Manual decision | Production result |
|---|---|---|---|
| unDraw | Open Graph PNG and PNG favicon | Clean, brand-specific illustration-library preview and recognisable favicon; no advertising or stale campaign content | Preview and favicon approved |
| Storyset | PNG favicon; no qualifying raster preview | Clean Storyset brand mark; preserve favicon-first fallback rather than inventing a preview | Favicon approved |
| DrawKit | Open Graph PNG and PNG favicon | Strong brand-specific preview and usable favicon; no overlays, unrelated promotions, or authentication content | Preview and favicon approved |

## Evidence and counts

- discovery checked only unDraw, Storyset, and DrawKit on `2026-08-01`;
- discovery produced 3 candidates and 0 blocked/unresolved outcomes;
- exact raster bytes were reviewed from short-lived Actions artifacts;
- file signatures and dimensions were checked before visual review;
- no image binary or network artifact is committed;
- approved production records: **6**;
- review targets: **8**;
- discovered candidates and approved-for-copy records: **3**;
- pending discovery: **5**;
- blocked/unresolved and rejected: **0**.

The approved source contains unDraw preview/favicon, Storyset favicon only, and DrawKit preview/favicon. Candidate records retain source URLs, response-header content types, checked dates, provenance, and reviewer notes. Candidate data still cannot publish itself.

## Boundaries preserved

- fallback remains manual preview → Open Graph preview → favicon → generated letter;
- no discovery for the other five queued resources;
- no mass enrichment, screenshot capture, proxy/cache, wildcard optimiser, remote SVG, or automatic publication;
- no invented URL, MIME type, licence, pricing, or access metadata;
- no card-layout, auth, Supabase, intelligence-profile, collection, or unrelated content change;
- normal build, tests, catalogue generation, and final CI remain network-free;
- all temporary discovery/download/regeneration workflows must be absent from the final diff.

## Verification completed before final CI

- candidate source and schema validation;
- deterministic candidate report generation;
- approved-media schema and six-record merge contract;
- candidate isolation from production catalogue composition;
- deterministic catalogue generation and migration checks;
- focused media, candidate, and catalogue tests;
- repository formatting for changed files.

Final typecheck, lint, full test suite, production build, browser/search/save/fallback checks, responsive screenshots, overflow checks, Phase 1 Release Gate, and Vercel readiness must pass on the helper-free exact head before squash merge.

## Rollback

Reverting this slice restores the 5.3b queue and prior three approved production records. Discovery tooling and card fallback behaviour remain intact.
""", encoding="utf-8")

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Format and run focused checks
        working-directory: web
        run: |
          npm run format
          npm run media:review:check
          node --test tests/resource-media-candidates.test.mjs tests/resource-media.test.mjs tests/catalogue-migration.test.mjs
          npm run catalogue:check
          npm run format:check

      - name: Commit final slice documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md docs/slices/5.3c-reviewed-media-discovery-pilot.md
          git commit -m "docs: record completed reviewed media pilot"
          git push origin HEAD:codex/reviewed-media-discovery-pilot
