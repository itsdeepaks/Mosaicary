name: One-use reviewed media pilot regeneration

on:
  push:
    branches:
      - codex/reviewed-media-discovery-pilot

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/reviewed-media-discovery-pilot
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Generate review and catalogue outputs
        working-directory: web
        run: |
          npm run media:review:generate
          npm run catalogue:generate
          npm run format

      - name: Run focused checks
        working-directory: web
        run: |
          npm run media:review:check
          node --test tests/resource-media-candidates.test.mjs tests/resource-media.test.mjs tests/catalogue-migration.test.mjs
          npm run catalogue:check
          npm run format:check

      - name: Commit deterministic pilot outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib_data/resource-media.json \
            lib_data/resource-media-candidates.json \
            docs/reports/resource-media-candidate-review.json \
            docs/reports/resource-media-candidate-review.md \
            docs/slices/5.3c-reviewed-media-discovery-pilot.md \
            web/data/catalogue.json \
            web/data/catalogue-validation.json
          if git diff --cached --quiet; then
            echo "No deterministic output changes required."
          else
            git commit -m "data: regenerate reviewed media pilot outputs"
            git push origin HEAD:codex/reviewed-media-discovery-pilot
          fi
