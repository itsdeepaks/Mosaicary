name: Preview provenance helper fixer

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'codex/media-batch-06' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace indentation-sensitive matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/preview-provenance-helper.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index("          anchor = '''      if (!previewSources.has(entry.preview.source)) {")
          end_marker = "          release_path.write_text(release, encoding='utf-8')"
          end = text.index(end_marker, start)
          replacement = '''          source_property_pattern = re.compile(
              r'      if \\(!previewSources\\.has\\(entry\\.preview\\.source\\)\\) \\{.*?\\n      \\}',
              re.S,
          )
          source_property_validation = ''' + "'''" + '''      if (!previewSources.has(entry.preview.source)) {
                errors.push(
                  issue(
                    "invalid-preview-source",
                    `${label} preview source is invalid.`,
                  ),
                );
              }
              if (entry.preview.sourceProperty !== undefined) {
                const allowedProperties = new Set(
                  previewSchema.properties.sourceProperty.enum,
                );
                if (!allowedProperties.has(entry.preview.sourceProperty)) {
                  errors.push(
                    issue(
                      "invalid-preview-source-property",
                      `${label} preview source property is invalid.`,
                    ),
                  );
                } else if (entry.preview.source === "manual") {
                  errors.push(
                    issue(
                      "manual-preview-source-property",
                      `${label} manual preview cannot claim metadata provenance.`,
                    ),
                  );
                } else if (
                  (entry.preview.source === "open-graph" &&
                    !entry.preview.sourceProperty.startsWith("og:")) ||
                  (entry.preview.source === "twitter" &&
                    !entry.preview.sourceProperty.startsWith("twitter:"))
                ) {
                  errors.push(
                    issue(
                      "preview-source-property-mismatch",
                      `${label} preview source and property do not match.`,
                    ),
                  );
                }
              }
          ''' + "'''" + '''
          release, count = source_property_pattern.subn(
              source_property_validation,
              release,
              count=1,
          )
          if count != 1:
              raise SystemExit(
                  f'approved source property validation: expected one block, found {count}'
              )
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          git rm .github/workflows/preview-provenance-helper-fixer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/preview-provenance-helper.yml
          git commit -m "chore: correct provenance helper matcher"
          git push origin HEAD:${{ github.head_ref }}
