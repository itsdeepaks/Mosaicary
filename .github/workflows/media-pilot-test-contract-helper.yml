name: One-use reviewed media pilot test contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-contract:
    if: github.head_ref == 'codex/reviewed-media-discovery-pilot' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/reviewed-media-discovery-pilot
          fetch-depth: 0

      - name: Update exact pilot assertions
        shell: python
        run: |
          from pathlib import Path

          candidates = Path("web/tests/resource-media-candidates.test.mjs")
          text = candidates.read_text(encoding="utf-8")
          start_marker = "  assert.equal(source.resources.length, 8);"
          end_marker = "\n\n  const reportAgain"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Candidate source assertion markers were not found")
          block = "\n".join([
              "  assert.equal(source.resources.length, 8);",
              "  const approvedForCopy = source.resources.filter(",
              "    (record) => record.reviewerStatus === \"approved-for-copy\",",
              "  );",
              "  const pending = source.resources.filter(",
              "    (record) => record.discoveryStatus === \"pending\",",
              "  );",
              "  assert.deepEqual(",
              "    approvedForCopy.map((record) => record.resourceId),",
              "    [",
              "      \"resource-73d75733406d\",",
              "      \"resource-92baaed92865\",",
              "      \"resource-08a9f0e0bd50\",",
              "    ],",
              "  );",
              "  assert.equal(",
              "    approvedForCopy.every(",
              "      (record) =>",
              "        record.discoveryStatus === \"candidate\" &&",
              "        Boolean(record.preview || record.favicon),",
              "    ),",
              "    true,",
              "  );",
              "  assert.equal(pending.length, 5);",
              "  assert.equal(",
              "    pending.every(",
              "      (record) =>",
              "        record.reviewerStatus === \"unreviewed\" &&",
              "        !record.preview &&",
              "        !record.favicon,",
              "    ),",
              "    true,",
              "  );",
          ])
          text = text[:start] + block + text[end:]
          replacements = [
              (
                  "  assert.equal(repositoryReview.report.summary.approvedProduction, 3);",
                  "  assert.equal(repositoryReview.report.summary.approvedProduction, 6);",
              ),
              (
                  "  assert.equal(repositoryReview.report.summary.discoveredCandidates, 0);",
                  "  assert.equal(repositoryReview.report.summary.discoveredCandidates, 3);\n  assert.equal(repositoryReview.report.summary.readyForCopy, 3);",
              ),
              (
                  "  assert.equal(repositoryReview.report.summary.pending, 8);",
                  "  assert.equal(repositoryReview.report.summary.pending, 5);",
              ),
              (
                  "  assert.equal(withMalformedCandidate.report.summary.approvedMedia, 3);",
                  "\n".join([
                      "  assert.equal(",
                      "    withMalformedCandidate.report.summary.approvedMedia,",
                      "    baseline.report.summary.approvedMedia,",
                      "  );",
                  ]),
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected candidate assertion was not found exactly once: {old}")
              text = text.replace(old, new, 1)
          candidates.write_text(text, encoding="utf-8")

          media = Path("web/tests/resource-media.test.mjs")
          text = media.read_text(encoding="utf-8")
          old_slugs = '    ["toools-design", "one-page-love", "awwwards"],'
          new_slugs = "\n".join([
              "    [",
              '      "toools-design",',
              '      "one-page-love",',
              '      "awwwards",',
              '      "undraw",',
              '      "storyset",',
              '      "drawkit",',
              "    ],",
          ])
          if text.count(old_slugs) != 1:
              raise SystemExit("Original three-resource slug assertion was not found exactly once")
          text = text.replace(old_slugs, new_slugs, 1)
          for old, new in [
              (
                  "  assert.equal(result.report.mediaSource.approvedCount, 3);",
                  "  assert.equal(result.report.mediaSource.approvedCount, 6);",
              ),
              (
                  "  assert.equal(result.report.summary.approvedMedia, 3);",
                  "  assert.equal(result.report.summary.approvedMedia, 6);",
              ),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected media count assertion was not found exactly once: {old}")
              text = text.replace(old, new, 1)
          media.write_text(text, encoding="utf-8")

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Regenerate and format
        working-directory: web
        run: |
          npm run media:review:generate
          npm run catalogue:generate
          npm run format

      - name: Run focused checks
        working-directory: web
        run: |
          npm run media:review:check
          node --test tests/resource-media-candidates.test.mjs tests/resource-media.test.mjs tests/catalogue-migration.test.mjs
          npm run catalogue:check
          npm run format:check

      - name: Commit reviewed pilot contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib_data/resource-media.json \
            lib_data/resource-media-candidates.json \
            docs/reports/resource-media-candidate-review.json \
            docs/reports/resource-media-candidate-review.md \
            docs/slices/5.3c-reviewed-media-discovery-pilot.md \
            web/data/catalogue.json \
            web/data/catalogue-validation.json \
            web/tests/resource-media-candidates.test.mjs \
            web/tests/resource-media.test.mjs
          git commit -m "test: update reviewed media pilot contract"
          git push origin HEAD:codex/reviewed-media-discovery-pilot
