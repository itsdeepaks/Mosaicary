name: One-use media slice finalizer

on:
  push:
    branches:
      - codex/media-discovery-review-tooling

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/media-discovery-review-tooling
          fetch-depth: 0

      - name: Record completed slice status
        shell: python
        run: |
          from pathlib import Path

          slices = Path("build-slices.md")
          text = slices.read_text(encoding="utf-8")
          old = "| 5.3b | Media discovery and review tooling | NEXT | 5.3a |"
          new = "| 5.3b | Media discovery and review tooling | DONE | 5.3a |"
          if text.count(old) != 1:
              raise SystemExit("Expected 5.3b NEXT row was not found exactly once")
          slices.write_text(text.replace(old, new, 1), encoding="utf-8")

          note = Path("docs/slices/5.3b-media-discovery-review-tooling.md")
          text = note.read_text(encoding="utf-8")
          replacements = {
              "Status: **implementation complete; merge blocked by unrelated `main` formatting failure**": "Status: **implementation complete; exact-head CI and browser QA passed; ready for squash merge**",
              "Current main merged into branch: `e17d8356b8467770c184fa3842ec49fd33638961`": "Current main merged into branch: `422b8b0df0fab7690272a764f9b25afa081f4b7b`",
              "After this branch began, `main` added `web/scripts/inspect-dev.mjs` at `e17d8356b8467770c184fa3842ec49fd33638961`. That commit was merged into the feature branch without overlap. Both exact-head Web CI and the Phase 1 Release Gate currently stop at repository-wide formatting because that unrelated file is not Prettier-formatted. The media slice must remain unmerged until the external blocker is resolved; this branch does not format or otherwise alter the unrelated user file.": "After this branch began, `main` added `web/scripts/inspect-dev.mjs` at `e17d8356b8467770c184fa3842ec49fd33638961`. Its unrelated formatting blocker was resolved through PR #44 and synced into this branch through PR #45 without entering the Slice 5.3b diff. Exact-head Web CI and the Phase 1 Release Gate now pass.",
              "17. `build-slices.md` records 5.3a as `DONE`; 5.3b remains `NEXT` until exact-head review, CI, and squash merge complete.": "17. `build-slices.md` records both 5.3a and 5.3b as `DONE` for the final squash-merge checkpoint.",
              "Exact-head full CI status:\n\n- dependency installation: passed;\n- hero asset verification/release contract: passed;\n- formatting: blocked by unrelated `web/scripts/inspect-dev.mjs` from current `main`;\n- typecheck, lint, full tests, catalogue drift, build, browser matrix, and screenshots: skipped after formatting failure and therefore not claimed.": "Exact-head full CI status:\n\n- dependency installation: passed;\n- formatting, typecheck, lint, full tests, candidate review drift, and catalogue drift: passed;\n- production build: passed;\n- search, save/remove, fallback, runtime-error, route, and responsive browser checks: passed;\n- 1440px, 1024px, 768px, 390px, and additional 320px screenshots/overflow checks: passed;\n- Phase 1 Release Gate: passed."
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected slice-note text was not found: {old[:80]}")
              text = text.replace(old, new, 1)
          note.write_text(text, encoding="utf-8")

      - name: Commit final slice status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md docs/slices/5.3b-media-discovery-review-tooling.md
          git commit -m "docs: record completed media discovery slice"
          git push origin HEAD:codex/media-discovery-review-tooling
