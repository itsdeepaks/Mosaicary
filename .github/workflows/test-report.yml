name: Test report

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/test-report.yml"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests and capture log
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm test > artifacts/test.log 2>&1
          status=$?
          cat artifacts/test.log
          echo "$status" > artifacts/test-status.txt
          exit 0

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: tessli-test-report
          path: web/artifacts/test-*
          if-no-files-found: error
          retention-days: 1
