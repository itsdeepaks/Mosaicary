name: Source detail formatter

on:
  push:
    branches:
      - feat/source-detail-foundation
    paths:
      - "web/app/resources/[slug]/page.tsx"
      - "web/components/source-detail/source-actions.tsx"
      - "web/tests/source-detail-foundation.test.mjs"
      - ".github/workflows/source-detail-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-detail-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prettier --write "app/resources/[slug]/page.tsx" "components/source-detail/source-actions.tsx" "tests/source-detail-foundation.test.mjs"
      - name: Commit formatting
        shell: bash
        working-directory: .
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/resources/'[slug]'/page.tsx web/components/source-detail/source-actions.tsx web/tests/source-detail-foundation.test.mjs
          git commit -m "style: format source detail slice"
          git push origin HEAD:feat/source-detail-foundation
