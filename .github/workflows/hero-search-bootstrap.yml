name: Finalize Hero Search Slice

on:
  pull_request:
    paths:
      - ".github/workflows/hero-search-bootstrap.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Reconcile delivery status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("../build-slices.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "| 3.2 | Search interaction and truthful facts | NEXT | 3.1 |":
                  "| 3.2 | Search interaction and truthful facts | DONE | 3.1 |",
              "| 4.1 | Catalogue CSV-to-JSON migration and validation | PLANNED | 1.1 |":
                  "| 4.1 | Catalogue CSV-to-JSON migration and validation | NEXT | 1.1 |",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
              elif count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(f"Expected exactly one status row: {old!r}; found {count}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply repository formatter
        run: npm run format

      - name: Commit final Slice 3.2 sources
        shell: bash
        run: |
          rm -f ../.github/workflows/hero-search-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(web): finalize hero search slice"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
