name: Phase 4.1 ledger update

on:
  push:
    branches:
      - docs/board-research-pack-contract
    paths:
      - ".github/workflows/phase-4-1-ledger-update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/board-research-pack-contract

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Update roadmap truth
        shell: python
        run: |
          from pathlib import Path

          slices_path = Path("build-slices.md")
          slices = slices_path.read_text()
          replacements = {
              "Status: **active delivery plan — Phase 4 / Slice 4.1 NEXT**":
                  "Status: **active delivery plan — Phase 4 / Slice 4.2 NEXT**",
              "|     4 | Research-Pack Export                        | ACTIVE   | 4.1 NEXT                   |":
                  "|     4 | Research-Pack Export                        | ACTIVE   | 4.2 NEXT                   |",
              "| 4.1  | Board research-pack contract                          | NEXT     | 3.4                     | —                                                            |":
                  "| 4.1  | Board research-pack contract                          | DONE     | 3.4                     | `docs/research-pack-contract.md`, PR #86                      |",
              "| 4.2  | Deterministic Markdown export                         | PLANNED  | 4.1                     | —                                                            |":
                  "| 4.2  | Deterministic Markdown export                         | NEXT     | 4.1                     | —                                                            |",
          }
          for old, new in replacements.items():
              if old not in slices:
                  raise SystemExit(f"Missing build-slices marker: {old}")
              slices = slices.replace(old, new, 1)
          phase4 = "### Phase 4 — Research-Pack Export\n\nFreeze the Board export contract, then implement deterministic model-independent Markdown and safe public source/collection representations. Never publish private local Board content."
          phase4_done = "### Phase 4 — Research-Pack Export\n\nSlice 4.1 is complete: `docs/research-pack-contract.md` freezes the versioned Board export contract, information-class boundaries, deterministic ordering and byte rules, relevance budget, unknown-source handling, provenance, privacy, accessibility, and Slice 4.2 test requirements.\n\nNext: Slice 4.2 implements deterministic local Copy Markdown and Download `.md`. Safe public source/collection representations remain Slice 4.3. Never publish private local Board content."
          if phase4 not in slices:
              raise SystemExit("Missing Phase 4 boundary marker")
          slices = slices.replace(phase4, phase4_done, 1)
          slices_path.write_text(slices)

          plan_path = Path("docs/product-plan-v2.md")
          plan = plan_path.read_text()
          for old, new in {
              "## 6. Phase 2 — Browse and Source Detail\n\nStatus: **ACTIVE**":
                  "## 6. Phase 2 — Browse and Source Detail\n\nStatus: **DONE**",
              "### 2.2 Canonical Browse implementation\n\nStatus: **NEXT**":
                  "### 2.2 Canonical Browse implementation\n\nStatus: **DONE**",
              "## 7. Phase 3 — Local Saved and Project Boards\n\nStatus: **PLANNED**":
                  "## 7. Phase 3 — Local Saved and Project Boards\n\nStatus: **DONE**",
              "## 8. Phase 4 — Research-Pack Export\n\nStatus: **PLANNED**":
                  "## 8. Phase 4 — Research-Pack Export\n\nStatus: **ACTIVE**",
              "### 4.1 Board export contract\n":
                  "### 4.1 Board export contract\n\nStatus: **DONE**\n",
              "### 4.2 Deterministic Markdown export\n":
                  "### 4.2 Deterministic Markdown export\n\nStatus: **NEXT**\n",
          }.items():
              if old not in plan:
                  raise SystemExit(f"Missing product-plan marker: {old}")
              plan = plan.replace(old, new, 1)
          plan_path.write_text(plan)

          test_path = Path("web/tests/release-hardening.test.mjs")
          test = test_path.read_text()
          old = '["4.1", "Board research-pack contract", "NEXT", "3.4", "—"],'
          new = '''[
      "4.1",
      "Board research-pack contract",
      "DONE",
      "3.4",
      "`docs/research-pack-contract.md`, PR #86",
    ],
    ["4.2", "Deterministic Markdown export", "NEXT", "4.1", "—"],'''
          if old not in test:
              raise SystemExit("Missing release-ledger row")
          test = test.replace(old, new, 1)
          old_status = r'/Status: \*\*active delivery plan — Phase 4 \/ Slice 4\.1 NEXT\*\*/'
          new_status = r'/Status: \*\*active delivery plan — Phase 4 \/ Slice 4\.2 NEXT\*\*/'
          if old_status not in test:
              raise SystemExit("Missing release-ledger status assertion")
          test = test.replace(old_status, new_status, 1)
          test_path.write_text(test)

      - name: Format changed files
        working-directory: web
        run: |
          npm ci
          npx prettier --write ../build-slices.md ../docs/product-plan-v2.md tests/release-hardening.test.mjs

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md docs/product-plan-v2.md web/tests/release-hardening.test.mjs
          git commit -m "docs: complete board research-pack contract ledger"
          git push origin HEAD:docs/board-research-pack-contract
