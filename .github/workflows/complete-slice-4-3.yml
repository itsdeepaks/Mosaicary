name: Complete Slice 4.3 ledger and evidence

on:
  push:
    branches:
      - feat/public-machine-readable-representations
    paths:
      - ".github/workflows/complete-slice-4-3.yml"

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/public-machine-readable-representations

      - name: Align Product Plan v2 completion state
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              content = target.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, found {content.count(old)} for {old!r}")
              target.write_text(content.replace(old, new, 1))

          # Operational ledger.
          replace_once(
              "build-slices.md",
              "Status: **active delivery plan — Phase 4 / Slice 4.3 NEXT**",
              "Status: **active delivery plan — Phase 5 / Slice 5.1 NEXT**",
          )
          replace_once(
              "build-slices.md",
              "- deterministic browser-local Markdown research-pack copy and download;\n",
              "- deterministic browser-local Markdown research-pack copy and download;\n- deterministic public source and collection Markdown/JSON representations;\n",
          )
          replace_once(
              "build-slices.md",
              "|     4 | Research-Pack Export                        | ACTIVE   | 4.3 NEXT                   |\n|     5 | Real OSS Proof Project                      | PROOF    | 5.1 after 4.2              |",
              "|     4 | Research-Pack Export                        | DONE     | —                          |\n|     5 | Real OSS Proof Project                      | ACTIVE   | 5.1 NEXT                   |",
          )
          replace_once(
              "build-slices.md",
              "| 4.3  | Safe public machine-readable representations          | NEXT     | 2.4, 4.2                | —                                                            |\n| 5.1  | OSS proof brief and research Board                    | PROOF    | 4.2                     | —                                                            |",
              "| 4.3  | Safe public machine-readable representations          | DONE     | 2.4, 4.2                | `docs/slices/4.3-public-machine-readable-representations.md`, PR #88 |\n| 5.1  | OSS proof brief and research Board                    | NEXT     | 4.3                     | —                                                            |",
          )
          replace_once(
              "build-slices.md",
              "### NEXT — Slice 4.3 Safe public machine-readable representations\n\nAdd public source and collection `.md`/`.json` representations only after privacy and route review. Keep representations deterministic, canonical, bounded, and indexable while never publishing private local Board content.",
              "### DONE — Slice 4.3 Safe public machine-readable representations\n\nDelivered:\n\n- deterministic `tessli.public-source.v1` JSON and Markdown for every canonical source;\n- deterministic `tessli.public-collection.v1` JSON and Markdown for every published collection;\n- one-source and one-collection route families with no bulk all-catalogue endpoint;\n- canonical SourceProfile truth and editorial collection ordering;\n- truthful Listed/Profiled/Verified and repository-versus-live-verification boundaries;\n- UTF-8, LF, stable ordering, two-space JSON, no Markdown trailing whitespace, and one final newline;\n- GET, HEAD, and OPTIONS behavior with content type, CORS, cache, `nosniff`, cross-origin resource policy, robots, and canonical/alternate Link headers;\n- sitemap and browser-release coverage for source and collection representations;\n- no Board, Saved, account, cookie, credential, environment, remote-provider, or private-content exposure;\n- no MCP, auth, cloud, catalogue/profile, dependency, Supabase, or deployment-state change.\n\nEvidence: `docs/slices/4.3-public-machine-readable-representations.md`, PR #88.",
          )
          replace_once(
              "build-slices.md",
              "### Phase 5 — Real OSS Proof Project\n\nUse a real OSS brief, Board, exported pack, agent build, browser verification, and genuine human review. Missing human review is a blocker, not permission to invent scores.",
              "### ACTIVE — Phase 5 Real OSS Proof Project\n\nSlice 5.1 is next. Use a real OSS brief, Board, exported pack, agent build, browser verification, and genuine human review. Missing human review is a blocker, not permission to invent scores.",
          )
          replace_once(
              "build-slices.md",
              "After Slice 4.2 merges, refresh `main` and begin Slice 4.3 on a new branch in this conversation.",
              "After Slice 4.3 merges, refresh `main` and begin Phase 5 / Slice 5.1 on a new branch in this conversation.",
          )

          # Phase plan.
          replace_once(
              "docs/product-plan-v2.md",
              "## 8. Phase 4 — Research-Pack Export\n\nStatus: **ACTIVE**",
              "## 8. Phase 4 — Research-Pack Export\n\nStatus: **DONE**",
          )
          replace_once(
              "docs/product-plan-v2.md",
              "### 4.3 Safe public machine-readable representations\n\nStatus: **NEXT**\n\nOnly after privacy review:\n\n- public source `.md` and `.json` representations;\n- public collection/playbook representations;\n- stable semantic pages and sitemap;\n- example public research pack;\n- no public exposure of private local Board content.\n\nPhase exit criteria:\n\n- the same Board snapshot and explicit date always produce the same export;\n- export is useful in models without MCP;\n- evidence and limitations survive compression;\n- private browser-local content is never published.",
              "### 4.3 Safe public machine-readable representations\n\nStatus: **DONE**\n\n- every canonical source exposes deterministic `profile.json` and `profile.md`;\n- every published collection exposes deterministic `collection.json` and `collection.md`;\n- canonical SourceProfile truth and editorial collection order are preserved;\n- response headers make representations readable, cacheable, indexable, and safe for cross-origin model clients;\n- repository intelligence remains explicitly distinct from live-provider verification;\n- no bulk catalogue endpoint or private browser-local Board content is published.\n\nEvidence: `docs/slices/4.3-public-machine-readable-representations.md`, PR #88.\n\nPhase exit criteria met:\n\n- the same Board snapshot and explicit date always produce the same export;\n- public source and collection context works without MCP;\n- evidence, limitations, and interpretation boundaries survive representation;\n- private browser-local content is never published.",
          )
          replace_once(
              "docs/product-plan-v2.md",
              "## 9. Phase 5 — Real OSS Proof Project\n\nStatus: **PROOF**",
              "## 9. Phase 5 — Real OSS Proof Project\n\nStatus: **ACTIVE — PROOF REQUIRED**",
          )
          replace_once(
              "docs/product-plan-v2.md",
              "### 5.1 Research setup\n\n- real brief, audience, and constraints;",
              "### 5.1 Research setup\n\nStatus: **NEXT**\n\n- real brief, audience, and constraints;",
          )

          # README.
          replace_once(
              "README.md",
              "- deterministic browser-local Markdown research-pack copy and download;\n",
              "- deterministic browser-local Markdown research-pack copy and download;\n- deterministic public Markdown/JSON for every source and published collection;\n",
          )
          replace_once(
              "README.md",
              "Phase 4  Research-Pack Export                    ACTIVE\nPhase 5  Real OSS Proof Project                  PROOF",
              "Phase 4  Research-Pack Export                    DONE\nPhase 5  Real OSS Proof Project                  ACTIVE",
          )
          replace_once(
              "README.md",
              "The approved next slice is **Phase 4 / Slice 4.3 — safe public machine-readable representations**.",
              "The approved next slice is **Phase 5 / Slice 5.1 — OSS proof brief and research Board**.",
          )
          replace_once(
              "README.md",
              "Tessli will support stable, semantic public source pages and deterministic Markdown/JSON exports that can be searched, shared, pasted, or uploaded to models.",
              "Tessli supports stable semantic source pages, deterministic Board research packs, and public source/collection Markdown and JSON that can be searched, shared, pasted, or uploaded to models.",
          )

          # Slice evidence.
          slice_path = Path("docs/slices/4.3-public-machine-readable-representations.md")
          slice_doc = slice_path.read_text()
          slice_doc = slice_doc.replace("Status: **IN PROGRESS**", "Status: **DONE**", 1)
          slice_doc += '''\n## Delivered\n\n- `tessli.public-source.v1` source JSON and Markdown for all 295 canonical slugs;\n- `tessli.public-collection.v1` collection JSON and Markdown for all six published collections;\n- deterministic serializers with stable ordering and byte rules;\n- canonical source-profile projection and editorial collection ordering;\n- GET, HEAD, and OPTIONS route behavior;\n- safe cache, CORS, content type, `nosniff`, cross-origin resource policy, robots, and Link headers;\n- sitemap and browser-release coverage;\n- explicit interpretation and live-verification boundaries;\n- no bulk endpoint and no private browser-local data exposure.\n\n## Review findings fixed\n\n- applied repository formatting to the new route, formatter, declaration, and test files;\n- replaced an index-signature declaration with explicit public-document types;\n- changed privacy testing from unsafe substring matching to recursive output-key inspection so truthful boundary text remains allowed;\n- isolated one transient Saved CDP runner failure by confirming the same head passed the Release Gate browser matrix and an unchanged Web CI rerun;\n- removed every temporary write-enabled workflow before final review.\n\n## Validation boundary\n\nThe final exact head, Web CI run, Release Gate run, complete-diff review, and review-thread state are recorded in PR #88. No failed check is bypassed.\n'''
          slice_path.write_text(slice_doc)

          # Release contract.
          test_path = Path("web/tests/release-hardening.test.mjs")
          test = test_path.read_text()
          test = test.replace(
              '''    [\n      "4.3",\n      "Safe public machine-readable representations",\n      "NEXT",\n      "2.4, 4.2",\n      "—",\n    ],''',
              '''    [\n      "4.3",\n      "Safe public machine-readable representations",\n      "DONE",\n      "2.4, 4.2",\n      "`docs/slices/4.3-public-machine-readable-representations.md`, PR #88",\n    ],\n    [\n      "5.1",\n      "OSS proof brief and research Board",\n      "NEXT",\n      "4.3",\n      "—",\n    ],''',
              1,
          )
          test = test.replace(
              r'/Status: \*\*active delivery plan — Phase 4 \/ Slice 4\.3 NEXT\*\*/',
              r'/Status: \*\*active delivery plan — Phase 5 \/ Slice 5\.1 NEXT\*\*/',
              1,
          )
          test = test.replace(
              r'/## 8\. Phase 4 — Research-Pack Export\n\nStatus: \*\*ACTIVE\*\*/',
              r'/## 8\. Phase 4 — Research-Pack Export\n\nStatus: \*\*DONE\*\*/',
              1,
          )
          test = test.replace(
              r'/### 4\.3 Safe public machine-readable representations\n\nStatus: \*\*NEXT\*\*/',
              r'/### 4\.3 Safe public machine-readable representations\n\nStatus: \*\*DONE\*\*/',
              1,
          )
          insertion = '''  assert.match(\n    plan,\n    /## 9\\. Phase 5 — Real OSS Proof Project\\n\\nStatus: \\*\\*ACTIVE — PROOF REQUIRED\\*\\*/,\n  );\n  assert.match(\n    plan,\n    /### 5\\.1 Research setup\\n\\nStatus: \\*\\*NEXT\\*\\*/,\n  );\n'''
          marker = '  assert.match(cutover, /dpl_6fj2gzYhAEDahEbeQZvVrTneejy9/);\n'
          if test.count(marker) != 1:
              raise SystemExit("release test insertion marker mismatch")
          test = test.replace(marker, insertion + marker, 1)
          test_path.write_text(test)

      - name: Format documentation and test changes
        working-directory: web
        run: npx prettier --write ../build-slices.md ../docs/product-plan-v2.md ../README.md ../docs/slices/4.3-public-machine-readable-representations.md tests/release-hardening.test.mjs

      - name: Commit completion state
        shell: bash
        run: |
          git config user.name "tessli-agent"
          git config user.email "actions@users.noreply.github.com"
          git add build-slices.md docs/product-plan-v2.md README.md docs/slices/4.3-public-machine-readable-representations.md web/tests/release-hardening.test.mjs
          git commit -m "docs: complete Phase 4 and activate OSS proof"
          git push origin HEAD:feat/public-machine-readable-representations
