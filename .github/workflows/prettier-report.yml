name: Prettier report

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/prettier-report.yml"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Format and capture patch
        shell: bash
        run: |
          npm run format
          mkdir -p artifacts
          git diff -- scripts/release-catalogue-lib.mjs > artifacts/prettier.patch
          test -s artifacts/prettier.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: tessli-prettier-report
          path: web/artifacts/prettier.patch
          if-no-files-found: error
          retention-days: 1
