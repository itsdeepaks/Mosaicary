name: One-use media CI path helper

on:
  push:
    branches:
      - codex/media-discovery-review-tooling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/media-discovery-review-tooling
          fetch-depth: 0

      - name: Add media review paths to Web CI
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/web-ci.yml")
          text = workflow.read_text(encoding="utf-8")
          collection_line = '      - "lib_data/tessli-launch-collections.json"\n'
          media_lines = (
              '      - "lib_data/resource-media.json"\n'
              '      - "lib_data/resource-media-candidates.json"\n'
          )
          schema_line = '      - "schemas/resource-intelligence-profile.schema.json"\n'
          media_schema_lines = (
              '      - "schemas/resource-media.schema.json"\n'
              '      - "schemas/resource-media-candidates.schema.json"\n'
          )
          docs_line = '      - "docs/data-and-media-contract.md"\n'
          media_docs_lines = (
              '      - "docs/resource-media-workflow.md"\n'
              '      - "docs/reports/resource-media-candidate-review.*"\n'
          )

          if text.count(collection_line) != 2 or text.count(schema_line) != 2 or text.count(docs_line) != 2:
              raise SystemExit("Expected Web CI path anchors were not found exactly twice")
          if media_lines in text or media_schema_lines in text or media_docs_lines in text:
              raise SystemExit("Media CI path entries already exist")

          text = text.replace(collection_line, collection_line + media_lines)
          text = text.replace(schema_line, schema_line + media_schema_lines)
          text = text.replace(docs_line, docs_line + media_docs_lines)
          workflow.write_text(text, encoding="utf-8")

      - name: Commit Web CI path filters
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/web-ci.yml
          git commit -m "ci: validate media candidate changes"
          git push origin HEAD:codex/media-discovery-review-tooling
