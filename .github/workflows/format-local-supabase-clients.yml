name: Format local Supabase client fixes

on:
  push:
    branches: [feat/local-supabase-clients]
    paths:
      - ".github/workflows/format-local-supabase-clients.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-supabase-clients

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Apply repository formatting
        working-directory: web
        run: npx prettier --write lib/supabase/config.ts tests/supabase-client-contract.test.mjs

      - name: Remove temporary evidence and workflow
        run: |
          rm docs/slices/10.1a-final-validation.log
          rm .github/workflows/format-local-supabase-clients.yml

      - name: Commit formatted slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/format-local-supabase-clients.yml \
            docs/slices/10.1a-final-validation.log \
            web/lib/supabase/config.ts \
            web/tests/supabase-client-contract.test.mjs
          git commit -m "style: format local Supabase client contract"
          git push origin HEAD:feat/local-supabase-clients
