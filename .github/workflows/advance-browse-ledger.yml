name: Advance Browse ledger

on:
  push:
    branches:
      - feat/canonical-browse
    paths:
      - ".github/workflows/advance-browse-ledger.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-browse
      - name: Advance Product Plan v2 ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('build-slices.md')
          text = path.read_text()
          replacements = [
              ('Status: **active delivery plan — Phase 2 / Slice 2.2 NEXT**', 'Status: **active delivery plan — Phase 2 / Slice 2.3 NEXT**'),
              ('| 2 | Browse and Source Detail | ACTIVE | 2.2 NEXT |', '| 2 | Browse and Source Detail | ACTIVE | 2.3 NEXT |'),
              ('| 2.2 | Canonical `/resources` implementation | NEXT | 2.1 | — |', '| 2.2 | Canonical `/resources` implementation | DONE | 2.1 | `docs/slices/2.2-canonical-browse-implementation.md`, PR #79 |'),
              ('| 2.3 | Source Detail foundation for all 295 sources | PLANNED | 1.2, 2.2 | — |', '| 2.3 | Source Detail foundation for all 295 sources | NEXT | 1.2, 2.2 | — |'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected ledger text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md
          git commit -m "docs: advance Product Plan v2 to Slice 2.3"
          git push origin HEAD:feat/canonical-browse
