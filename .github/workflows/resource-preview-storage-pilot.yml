name: Resource preview storage pilot

on:
  push:
    branches:
      - agent/resource-preview-storage-pilot
    paths:
      - ".github/workflows/resource-preview-storage-pilot.yml"
      - "web/scripts/capture-resource-preview-pilot.mjs"
      - "web/tests/resource-preview-pilot.test.mjs"
      - "web/package.json"
      - "supabase/migrations/20260803141305_create_resource_preview_pilot_bucket.sql"
      - "supabase/migrations/20260803141621_remove_resource_preview_pilot_anon_upload.sql"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/resource-preview-storage-pilot.yml"
      - "web/scripts/capture-resource-preview-pilot.mjs"
      - "web/tests/resource-preview-pilot.test.mjs"
      - "web/package.json"
      - "supabase/migrations/20260803141305_create_resource_preview_pilot_bucket.sql"
      - "supabase/migrations/20260803141621_remove_resource_preview_pilot_anon_upload.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-preview-storage-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PILOT_UPLOAD_URL: https://jckrtcqzpxywuejlprud.supabase.co/functions/v1/resource-preview-pilot-upload
      PILOT_PUBLIC_BUCKET_BASE: https://jckrtcqzpxywuejlprud.supabase.co/storage/v1/object/public/resource-previews
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install WebP encoder
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Resolve Chrome
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          "$chrome_bin" --version
          cwebp -version

      - name: Verify pilot contract
        working-directory: web
        run: node --test tests/resource-preview-pilot.test.mjs

      - name: Capture, compress, and upload pilot covers
        shell: bash
        run: |
          mkdir -p artifacts/resource-preview-pilot
          node web/scripts/capture-resource-preview-pilot.mjs \
            --output artifacts/resource-preview-pilot \
            | tee artifacts/resource-preview-pilot/run.log

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-preview-storage-pilot
          path: artifacts/resource-preview-pilot
          if-no-files-found: error
          retention-days: 14
