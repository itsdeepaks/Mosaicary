name: Complete Phase 2 ledger

on:
  push:
    branches:
      - feat/enriched-source-intelligence
    paths:
      - ".github/workflows/phase-2-ledger-complete.yml"

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/enriched-source-intelligence
          fetch-depth: 0

      - name: Apply bounded status update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("build-slices.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "Status: **active delivery plan — Phase 2 / Slice 2.4 NEXT**": "Status: **active delivery plan — Phase 3 / Slice 3.1 NEXT**",
              "| 2 | Browse and Source Detail | ACTIVE | 2.4 NEXT |": "| 2 | Browse and Source Detail | DONE | — |",
              "| 3 | Local Saved and Project Boards | PLANNED | 3.1 |": "| 3 | Local Saved and Project Boards | ACTIVE | 3.1 NEXT |",
              "| 2.4 | Enriched intelligence detail and Similar Sources | NEXT | 2.3 | — |": "| 2.4 | Enriched intelligence detail and Similar Sources | DONE | 2.3 | `docs/slices/2.4-enriched-intelligence-detail.md`, PR #81 |",
              "## 12. Phase 2 / Slice 2.3 completion and Slice 2.4 next": "## 12. Phase 2 completion evidence",
              "### NEXT — 2.4 Enriched intelligence and Similar Sources": "### Slice 2.4 completion evidence",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit ledger update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md
          git diff --cached --check
          git commit -m "docs: complete Phase 2 ledger"
          git push origin HEAD:feat/enriched-source-intelligence
