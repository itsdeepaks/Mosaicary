name: Format canonical Browse

on:
  push:
    branches:
      - feat/canonical-browse
    paths:
      - ".github/workflows/format-canonical-browse.yml"
      - "web/app/resources/page.tsx"
      - "web/app/resources/[slug]/page.tsx"
      - "web/components/browse/**"
      - "web/lib/browse.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/canonical-browse
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Format Browse files
        working-directory: web
        run: >-
          npx prettier --write
          app/resources/page.tsx
          'app/resources/[slug]/page.tsx'
          components/browse/browse-results.tsx
          components/browse/browse.module.css
          lib/browse.ts
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/resources web/components/browse web/lib/browse.ts
          git commit -m "style: format canonical Browse files"
          git push origin HEAD:feat/canonical-browse
