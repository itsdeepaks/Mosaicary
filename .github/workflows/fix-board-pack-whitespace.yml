name: Apply Board pack whitespace review fix

on:
  push:
    branches:
      - feat/deterministic-markdown-export
    paths:
      - ".github/workflows/fix-board-pack-whitespace.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/deterministic-markdown-export

      - name: Apply review fix and regression coverage
        shell: python
        run: |
          from pathlib import Path

          formatter_path = Path("web/lib/board-research-pack.mjs")
          formatter = formatter_path.read_text()
          old = '''  const markdown = `${lines
            .map((line) => normalizeLineEndings(line).replace(/[ \\t]+$/gu, ""))
            .join("\\n")
            .replace(/\\n+$/gu, "")}\\n`;
          '''
          new = '''  const markdown = `${lines
            .flatMap((line) => normalizeLineEndings(line).split("\\n"))
            .map((line) => line.replace(/[ \\t]+$/gu, ""))
            .join("\\n")
            .replace(/\\n+$/gu, "")}\\n`;
          '''
          if old not in formatter:
              raise SystemExit("formatter target not found")
          formatter_path.write_text(formatter.replace(old, new))

          test_path = Path("web/tests/board-research-pack.test.mjs")
          tests = test_path.read_text()
          marker = '''test("changing the explicit date changes only the generated line", () => {
          '''
          regression = '''test("multiline Board content is normalized without trailing whitespace", () => {
            const input = makeInput();
            input.board.goal = "First line  \\r\\nSecond line\\t";
            input.board.items[0].note = "Primary note  \\r\\nContinuation\\t";
            input.board.unresolvedQuestions = ["Question line  \\r\\ncontinued\\t"];
            input.implementationReminders = ["Additional reminder  \\r\\ncontinued\\t"];

            const result = createBoardResearchPack(input);
            assert.equal(result.ok, true);
            assert.doesNotMatch(result.markdown, /\\r/u);
            assert.doesNotMatch(result.markdown, /[ \\t]+$/gmu);
            assert.match(result.markdown, /First line\\nSecond line/u);
            assert.match(result.markdown, /Primary note\\nContinuation/u);
            assert.match(result.markdown, /1\\. Question line\\ncontinued/u);
            assert.match(result.markdown, /- Additional reminder\\ncontinued/u);
          });

          '''
          if marker not in tests:
              raise SystemExit("test insertion marker not found")
          test_path.write_text(tests.replace(marker, regression + marker, 1))

          evidence_path = Path("docs/slices/4.2-deterministic-markdown-export.md")
          evidence = evidence_path.read_text()
          evidence_marker = "- replaced a brittle source-text assertion with whitespace-tolerant copy validation;\n"
          evidence_addition = evidence_marker + "- normalized embedded multiline Board content before per-line trailing-whitespace cleanup;\n"
          if evidence_marker not in evidence:
              raise SystemExit("evidence insertion marker not found")
          evidence_path.write_text(evidence.replace(evidence_marker, evidence_addition, 1))

      - name: Commit review fix
        shell: bash
        run: |
          git config user.name "tessli-agent"
          git config user.email "actions@users.noreply.github.com"
          git add web/lib/board-research-pack.mjs web/tests/board-research-pack.test.mjs docs/slices/4.2-deterministic-markdown-export.md
          git commit -m "fix: normalize multiline research-pack whitespace"
          git push origin HEAD:feat/deterministic-markdown-export
