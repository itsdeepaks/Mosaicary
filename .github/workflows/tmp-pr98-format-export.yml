name: Temporary PR98 Format Commit

on:
  push:
    branches:
      - feat/verification-contract-operator-workflow
    paths:
      - .github/pr98-format-ready

permissions:
  contents: write

jobs:
  format-commit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/verification-contract-operator-workflow
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Format verification files
        run: npx prettier --write ../schemas/resource-verification-record.schema.json lib/resource-verification.ts scripts/resource-verification.mjs tests/resource-verification.test.mjs
      - name: Commit exact formatting
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/resource-verification-record.schema.json web/lib/resource-verification.ts web/scripts/resource-verification.mjs web/tests/resource-verification.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format verification workflow"
            git push origin HEAD:feat/verification-contract-operator-workflow
          fi
