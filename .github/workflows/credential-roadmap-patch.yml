name: Credential Roadmap Patch

on:
  push:
    branches:
      - feat/credential-ready-supabase-contract

permissions:
  contents: write

jobs:
  patch-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/credential-ready-supabase-contract
          fetch-depth: 0
      - name: Patch the active delivery ledger
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("build-slices.md")
          content = path.read_text(encoding="utf-8")

          old_table = """| 10.1a | Local Supabase SSR clients and environment contract | DONE | Phase 1 |
          | 10.1b | Supabase cloud project link and client smoke test | BLOCKED | 10.1a, project approval |
          | 10.2 | Auth shell, password, OTP, and Google | PLANNED | 10.1b |
          | 11.1 | User-data schema and RLS | PLANNED | 10.1b |
          | 11.2 | Cloud saves, private collections, notes, local import | PLANNED | 10.2, 11.1 |
          | 12.1 | Submit, suggest, and report forms | PLANNED | 10.2, 11.1 |"""

          new_table = """| 10.1a | Local Supabase SSR clients and environment contract | DONE | Phase 1 |
          | 10.1b | Supabase cloud project link and client smoke test | DEFERRED | 10.1a, project approval |
          | 10.1c | Credential-ready Supabase activation contract | DONE | 10.1a |
          | 10.2a | Credential-ready auth shell and unavailable state | NEXT | 10.1c |
          | 10.2b | Password, OTP, and Google activation | BLOCKED | 10.1b, 10.2a |
          | 11.1 | User-data schema and RLS | PLANNED | 10.1b |
          | 11.2 | Cloud saves, private collections, notes, local import | PLANNED | 10.2b, 11.1 |
          | 12.1 | Submit, suggest, and report forms | PLANNED | 10.2b, 11.1 |"""

          old_intro = """These begin only after Phase 1 and required credentials are available.

          Requirements include:

          - Supabase SSR/cookie clients;
          - password, OTP, and Google auth;"""

          new_intro = """Credential-ready contracts and UI may proceed after Phase 1 without cloud credentials. Live authentication, database/RLS verification, cloud data, email delivery, and community workflows remain blocked until their external setup is available.

          Requirements include:

          - Supabase SSR/cookie clients and explicit configuration readiness;
          - a truthful unavailable auth state before credentials exist;
          - password, OTP, and Google auth activation after cloud linking;"""

          for old, new, label in (
              (old_table, new_table, "slice table"),
              (old_intro, new_intro, "accounts introduction"),
          ):
              if content.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {label} match")
              content = content.replace(old, new)

          path.write_text(content, encoding="utf-8")
          Path(".github/workflows/credential-roadmap-patch.yml").unlink()
          PY
      - name: Commit roadmap correction and helper removal
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-slices.md .github/workflows/credential-roadmap-patch.yml
          git commit -m "docs: split credential-ready auth from live activation"
          git push origin HEAD:feat/credential-ready-supabase-contract
