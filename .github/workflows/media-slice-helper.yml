name: One-use media slice formatter

on:
  push:
    branches:
      - codex/media-discovery-review-tooling

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/media-discovery-review-tooling
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply exact ledger and source fixes
        shell: python
        run: |
          from pathlib import Path

          slices = Path("build-slices.md")
          text = slices.read_text(encoding="utf-8")
          old_a = "| 5.3a | Approved resource-media source and rendering pilot | NEXT | 5.2 |"
          old_b = "| 5.3b | Media discovery and review tooling | PLANNED | 5.3a |"
          if old_a not in text or old_b not in text:
              raise SystemExit("Expected media slice status rows were not found")
          text = text.replace(old_a, "| 5.3a | Approved resource-media source and rendering pilot | DONE | 5.2 |", 1)
          text = text.replace(old_b, "| 5.3b | Media discovery and review tooling | DONE | 5.3a |", 1)
          old_follow_up = "### Follow-up slice 5.3b\n\nBuild reviewed discovery and refresh tooling only after the source contract has proved stable. It must preserve the same validation boundary and separately address CSP/cache policy, redirect handling, content-size limits, and reviewer workflow."
          new_follow_up = "### Slice 5.3b — reviewed discovery and refresh tooling\n\nA separate candidate/review source, deterministic offline report, and explicit opt-in discovery command preserve the approved-media boundary. Discovery validates redirects, public network destinations, response size, raster content types, and reviewer state without running during normal build, test, or CI."
          if old_follow_up not in text:
              raise SystemExit("Expected 5.3b follow-up paragraph was not found")
          slices.write_text(text.replace(old_follow_up, new_follow_up, 1), encoding="utf-8")

          discovery = Path("web/scripts/resource-media-discovery-lib.mjs")
          source = discovery.read_text(encoding="utf-8")
          old_shift = "return address >> shift === base >> shift;"
          if old_shift not in source:
              raise SystemExit("Expected IPv6 comparison was not found")
          discovery.write_text(
              source.replace(old_shift, "return (address >> shift) === (base >> shift);", 1),
              encoding="utf-8",
          )

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Format repository files
        working-directory: web
        run: npm run format

      - name: Regenerate media review reports
        working-directory: web
        run: npm run media:review:generate

      - name: Run focused checks
        working-directory: web
        run: |
          node --check scripts/resource-media-review-lib.mjs
          node --check scripts/resource-media-discovery-lib.mjs
          node --check scripts/discover-resource-media.mjs
          node --check scripts/generate-resource-media-review.mjs
          node --check scripts/check-resource-media-candidates.mjs
          node --test tests/resource-media-candidates.test.mjs tests/resource-media.test.mjs
          npm run media:review:check

      - name: Commit formatted slice files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build-slices.md \
            docs/data-and-media-contract.md \
            docs/resource-media-workflow.md \
            docs/reports/resource-media-candidate-review.json \
            docs/reports/resource-media-candidate-review.md \
            docs/slices/5.3b-media-discovery-review-tooling.md \
            lib_data/resource-media-candidates.json \
            schemas/resource-media-candidates.schema.json \
            web/package.json \
            web/scripts/resource-media-review-lib.mjs \
            web/scripts/resource-media-discovery-lib.mjs \
            web/scripts/discover-resource-media.mjs \
            web/scripts/generate-resource-media-review.mjs \
            web/scripts/check-resource-media-candidates.mjs \
            web/tests/resource-media-candidates.test.mjs
          if git diff --cached --quiet; then
            echo "No formatter or report changes required."
          else
            git commit -m "style: format media discovery slice"
            git push origin HEAD:codex/media-discovery-review-tooling
          fi
