name: One-use reviewed media discovery pilot PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    if: github.head_ref == 'codex/reviewed-media-discovery-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Run explicit reviewed discovery pilot
        working-directory: web
        run: |
          mkdir -p artifacts
          npm run media:discover -- \
            --checked-at 2026-08-01 \
            --output artifacts/5.3c-media-discovery.json \
            --resource-id resource-73d75733406d \
            --resource-id resource-92baaed92865 \
            --resource-id resource-08a9f0e0bd50

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: tessli-5.3c-media-discovery
          path: web/artifacts/5.3c-media-discovery.json
          if-no-files-found: error
          retention-days: 2
