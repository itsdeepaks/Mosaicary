name: Media Batch 06 discovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    if: github.head_ref == 'codex/media-batch-06-reviewed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Select deterministic pending batch
        shell: bash
        run: |
          mkdir -p artifacts/media-batch-06
          cd web
          node scripts/select-resource-media-batch.mjs --limit 20 > ../artifacts/media-batch-06/selection.json
          test "$(node -e 'const x=require("../artifacts/media-batch-06/selection.json"); process.stdout.write(String(x.resourceIds.length))')" = "20"

      - name: Discover official metadata
        shell: bash
        run: |
          mapfile -t IDS < <(node -e 'const x=require("./artifacts/media-batch-06/selection.json"); for (const id of x.resourceIds) console.log(id)')
          ARGS=()
          for id in "${IDS[@]}"; do
            ARGS+=(--resource-id "$id")
          done
          cd web
          node scripts/discover-resource-media.mjs \
            --checked-at 2026-08-02 \
            --output ../artifacts/media-batch-06/candidates.json \
            "${ARGS[@]}"

      - name: Validate candidate evidence
        working-directory: web
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateCandidateSource } from './scripts/resource-media-review-lib.mjs';
          const candidates = JSON.parse(fs.readFileSync('../artifacts/media-batch-06/candidates.json', 'utf8'));
          const catalogue = JSON.parse(fs.readFileSync('./data/catalogue.json', 'utf8'));
          const result = validateCandidateSource(candidates, catalogue.resources);
          if (result.errors.length) {
            for (const error of result.errors) console.error(`[${error.code}] ${error.message}`);
            process.exit(1);
          }
          console.log(`Validated ${candidates.resources.length} candidate records with ${result.warnings.length} warning(s).`);
          NODE

      - name: Package exact raster responses for review
        run: >-
          node .github/scripts/package-media-review.mjs
          artifacts/media-batch-06/candidates.json
          artifacts/media-batch-06/review-media

      - name: Write discovery summary
        shell: bash
        run: |
          node <<'NODE' > artifacts/media-batch-06/summary.json
          const fs = require('node:fs');
          const selection = JSON.parse(fs.readFileSync('artifacts/media-batch-06/selection.json'));
          const candidates = JSON.parse(fs.readFileSync('artifacts/media-batch-06/candidates.json'));
          const counts = {};
          for (const item of candidates.resources) counts[item.discoveryStatus] = (counts[item.discoveryStatus] || 0) + 1;
          process.stdout.write(JSON.stringify({
            version: 1,
            checkedAt: '2026-08-02',
            resourceIds: selection.resourceIds,
            discoveryStatusCounts: counts,
          }, null, 2) + '\n');
          NODE

      - name: Upload temporary review evidence
        uses: actions/upload-artifact@v4
        with:
          name: tessli-media-batch-06-review
          path: artifacts/media-batch-06
          if-no-files-found: error
          retention-days: 7
