name: Generate release catalogue

on:
  pull_request:
    paths:
      - "lib_data/tessli-launch-collections.json"
      - "schemas/collections.schema.json"
      - "web/scripts/**"
      - "web/tests/**"
      - ".github/workflows/generate-release-catalogue.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate validated catalogue outputs
        run: npm run catalogue:generate

      - name: Commit deterministic outputs
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- web/data/catalogue.json web/data/catalogue-validation.json; then
            echo "Generated catalogue outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/catalogue.json web/data/catalogue-validation.json
          git commit -m "data: generate launch collections"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
