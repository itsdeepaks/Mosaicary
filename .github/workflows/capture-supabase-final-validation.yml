name: Capture Supabase final validation

on:
  push:
    branches: [feat/local-supabase-clients]
    paths:
      - ".github/workflows/capture-supabase-final-validation.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-supabase-clients
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Capture every validation stage
        shell: bash
        run: |
          set +e
          report="$GITHUB_WORKSPACE/docs/slices/10.1a-final-validation.log"
          : > "$report"

          run_stage() {
            name="$1"
            shift
            echo "## $name" >> "$report"
            "$@" >> "$report" 2>&1
            status=$?
            echo "status=$status" >> "$report"
            echo >> "$report"
          }

          cd web
          run_stage install npm ci
          run_stage focused node --test tests/supabase-client-contract.test.mjs tests/scaffold.test.mjs
          run_stage format-check npm run format:check
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage test npm test
          run_stage catalogue npm run catalogue:check
          run_stage build npm run build
          cd ..

          echo "## diff" >> "$report"
          git diff --name-only origin/main...HEAD >> "$report" 2>&1
          echo >> "$report"

          rm -f .github/workflows/validate-local-supabase-clients.yml
          rm -f .github/workflows/capture-supabase-final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/slices/10.1a-final-validation.log .github/workflows/validate-local-supabase-clients.yml .github/workflows/capture-supabase-final-validation.yml
          git commit -m "test: capture final Supabase validation"
          git push origin HEAD:feat/local-supabase-clients
