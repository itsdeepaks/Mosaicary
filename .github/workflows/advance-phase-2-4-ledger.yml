name: Advance Phase 2.4 ledger

on:
  push:
    branches:
      - feat/enriched-source-intelligence
    paths:
      - ".github/workflows/advance-phase-2-4-ledger.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/enriched-source-intelligence
      - name: Update active plan
        shell: python
        run: |
          from pathlib import Path

          path = Path("build-slices.md")
          text = path.read_text()
          replacements = {
              "Status: **active delivery plan — Phase 2 / Slice 2.4 NEXT**": "Status: **active delivery plan — Phase 3 / Slice 3.1 NEXT**",
              "| 2 | Browse and Source Detail | ACTIVE | 2.4 NEXT |": "| 2 | Browse and Source Detail | DONE | — |",
              "| 3 | Local Saved and Project Boards | PLANNED | 3.1 |": "| 3 | Local Saved and Project Boards | ACTIVE | 3.1 NEXT |",
              "| 2.4 | Enriched intelligence detail and Similar Sources | NEXT | 2.3 | — |": "| 2.4 | Enriched intelligence detail and Similar Sources | DONE | 2.3 | `docs/slices/2.4-enriched-intelligence-detail.md`, PR #81 |",
              "| 3.1 | Universal browser-local Save | PLANNED | 2.2, 2.3 | — |": "| 3.1 | Universal browser-local Save | NEXT | 2.2, 2.3, 2.4 | — |",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing expected ledger text: {old}")
              text = text.replace(old, new, 1)

          text += """

## 13. Phase 2 / Slice 2.4 completion evidence

- existing 20 Profiled records now expose recorded capabilities, content objects, platforms, frameworks, integrations, formats, tools, governance, and evidence;
- Listed records do not gain invented intelligence;
- coverage remains 275 Listed / 20 Profiled / 0 Verified;
- Similar Sources uses explainable category, source-type, capability, content-object, and framework overlap;
- no popularity, trend, rating, aesthetic score, semantic search, or universal Compare was introduced;
- detailed evidence: `docs/slices/2.4-enriched-intelligence-detail.md`;
- pull request: PR #81.
"""
          path.write_text(text)
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-slices.md
          git commit -m "docs: complete phase 2 enriched intelligence"
          git push origin HEAD:feat/enriched-source-intelligence
