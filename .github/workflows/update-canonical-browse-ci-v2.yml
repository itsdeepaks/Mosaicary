name: Update canonical Browse CI v2

on:
  push:
    branches:
      - feat/canonical-browse
    paths:
      - ".github/workflows/update-canonical-browse-ci-v2.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-browse
      - name: Align Web CI assertions
        shell: bash
        run: |
          sed -i 's/data-result-count=\\"295\\"/data-result-count=\\"12\\"/g' .github/workflows/web-ci.yml
          sed -i 's/data-visible-result-count=\\"48\\"/data-visible-result-count=\\"12\\"/g' .github/workflows/web-ci.yml
          sed -i 's/data-full-reference-page=\\"true\\"/data-browse-view=\\"cards\\"/g' .github/workflows/web-ci.yml
          sed -i 's/data-reference-table=\\"true\\"/data-browse-view=\\"cards\\"/g' .github/workflows/web-ci.yml
          sed -i 's/Source-backed, not ranked/Browse design sources/g' .github/workflows/web-ci.yml
          sed -i 's/Full Reference/Canonical Browse/g' .github/workflows/web-ci.yml
      - name: Commit Web CI update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/web-ci.yml
          git commit -m "test: align Web CI with canonical Browse"
          git push origin HEAD:feat/canonical-browse
