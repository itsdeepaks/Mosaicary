name: Source profile canonical formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/source-profile-format.yml"
      - "web/lib/source-profiles.ts"
      - "web/scripts/check-source-profile-contract.mjs"
      - "web/tests/source-profile-contract.test.mjs"

permissions:
  contents: read

concurrency:
  group: source-profile-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Format source contract files
        working-directory: web
        run: |
          npx prettier --write \
            lib/source-profiles.ts \
            scripts/check-source-profile-contract.mjs \
            tests/source-profile-contract.test.mjs

      - name: Upload canonical source
        uses: actions/upload-artifact@v4
        with:
          name: source-profile-canonical-format
          path: |
            web/lib/source-profiles.ts
            web/scripts/check-source-profile-contract.mjs
            web/tests/source-profile-contract.test.mjs
          if-no-files-found: error
          retention-days: 2
