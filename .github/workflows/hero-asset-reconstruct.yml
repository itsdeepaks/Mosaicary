name: Reconstruct Approved Hero Asset

on:
  pull_request:
    paths:
      - ".github/workflows/hero-asset-reconstruct.yml"
      - ".github/hero-asset-transfer/**"

permissions:
  contents: write

concurrency:
  group: reconstruct-tessli-hero-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Reconstruct and verify approved asset
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/hero-reconstruction
          diagnostics="artifacts/hero-reconstruction/diagnostics.txt"
          : > "$diagnostics"
          status=0

          parts=(
            .github/hero-asset-transfer/part-00.b64
            .github/hero-asset-transfer/part-01.b64
            .github/hero-asset-transfer/rest-00.b64
            .github/hero-asset-transfer/rest-01.b64
            .github/hero-asset-transfer/rest-02.b64
            .github/hero-asset-transfer/rest-03.b64
            .github/hero-asset-transfer/rest-04.b64
            .github/hero-asset-transfer/rest-05.b64
            .github/hero-asset-transfer/rest-06.b64
          )
          expected_lengths=(7500 7500 10000 10000 10000 10000 10000 10000 7312)

          for index in "${!parts[@]}"; do
            if [[ ! -s "${parts[$index]}" ]]; then
              echo "${parts[$index]}: missing" | tee -a "$diagnostics"
              status=1
              continue
            fi
            actual="$(tr -d '\r\n' < "${parts[$index]}" | wc -c)"
            echo "${parts[$index]}: actual=$actual expected=${expected_lengths[$index]}" | tee -a "$diagnostics"
            if [[ "$actual" -ne "${expected_lengths[$index]}" ]]; then
              status=1
            fi
          done

          cat "${parts[@]}" 2>> "$diagnostics" | tr -d '\r\n' > /tmp/tessli-hero.b64 || status=1
          combined_length="$(wc -c < /tmp/tessli-hero.b64 2>/dev/null || echo 0)"
          echo "Combined base64 length: $combined_length (expected 82312)" | tee -a "$diagnostics"
          if [[ "$combined_length" -ne 82312 ]]; then
            status=1
          fi

          if base64 --decode /tmp/tessli-hero.b64 > /tmp/tessli-hero.webp 2>> "$diagnostics"; then
            decoded_size="$(stat -c '%s' /tmp/tessli-hero.webp)"
            decoded_hash="$(sha256sum /tmp/tessli-hero.webp | cut -d ' ' -f 1)"
            decoded_type="$(file /tmp/tessli-hero.webp)"
            echo "Decoded byte count: $decoded_size (expected 61732)" | tee -a "$diagnostics"
            echo "Decoded SHA-256: $decoded_hash" | tee -a "$diagnostics"
            echo "$decoded_type" | tee -a "$diagnostics"
            [[ "$decoded_size" -eq 61732 ]] || status=1
            [[ "$decoded_hash" = "0bf8d0fcea17d10b041b2bc08422679acf4fffd7c54fc70c1b18aba9d1d85583" ]] || status=1
            grep -q "Web/P image" <<< "$decoded_type" || status=1
          else
            echo "Base64 decoding failed." | tee -a "$diagnostics"
            status=1
          fi

          if [[ "$status" -ne 0 ]]; then
            echo "Reconstruction verification failed; repository assets were not modified." | tee -a "$diagnostics"
            exit 1
          fi

          mkdir -p brand-preview/assets web/public/brand
          cp /tmp/tessli-hero.webp brand-preview/assets/tessli-hero-geometry.webp
          cp /tmp/tessli-hero.webp web/public/brand/tessli-hero-geometry.webp
          cmp --silent brand-preview/assets/tessli-hero-geometry.webp web/public/brand/tessli-hero-geometry.webp
          echo "Reconstruction verification passed." | tee -a "$diagnostics"

      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessli-hero-reconstruction-diagnostics
          path: artifacts/hero-reconstruction/diagnostics.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary transport and commit exact asset
        if: success()
        shell: bash
        run: |
          rm -rf .github/hero-asset-transfer
          rm -f .github/workflows/hero-asset-diagnostic.yml
          rm -f .github/workflows/hero-asset-reconstruct.yml
          rm -rf artifacts/hero-reconstruction

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): restore approved Tessli hero asset"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
